<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>４年小数</title>
<style>
  :root{
    --ink:#28323c;
    --line:#2a3742;
    --paper:#fbfaf5;
    --grid:#e7ecef;
    --rule:#cfd8dd;
    --red:#e02424;
    --arrow:#f2602a;
    --hint:#ffd34d;
    --rand:#3a86d6;
    --regen:#34a87a;
    --check:#f2602a;
    --key:#ffffff;
    --keyline:#d7dde1;
    --ok:#2f9e60;
    --ng:#d8533a;
    --hintlbl:#2f6fd0;
  }
  *{box-sizing:border-box;}
  /* 1画面におさめる：ページ全体はスクロールしない */
  html,body{margin:0;height:100%;overflow:hidden;}
  body{
    font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Yu Gothic UI",system-ui,sans-serif;
    background:
      linear-gradient(0deg, rgba(0,0,0,0.015) 1px, transparent 1px) 0 0/100% 28px,
      var(--paper);
    color:var(--ink);
    height:100vh;height:100dvh;
    padding:clamp(6px,1.2vh,14px) clamp(8px,1.4vw,16px);
  }
  /* 横長：左＝問題 / 右＝こたえ・テンキー */
  .wrap{
    height:100%;max-width:1280px;margin:0 auto;
    display:grid;grid-template-columns:minmax(0,1fr) clamp(250px,30vw,360px);
    gap:clamp(8px,1.4vw,16px);
  }
  .wrap.noans{grid-template-columns:minmax(0,1fr);}
  .main{display:flex;flex-direction:column;min-height:0;min-width:0;gap:clamp(4px,1vh,10px);}
  .top{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;}
  h1{font-size:clamp(.95rem,2.4vh,1.15rem);font-weight:800;letter-spacing:.02em;margin:0;color:var(--ink);}
  .sub{font-size:clamp(.78rem,1.9vh,.92rem);color:#6a7780;margin:0;}

  /* タブ */
  .levels{display:flex;gap:6px;flex-wrap:wrap;margin:0;}
  .levels button{
    background:#eef2f4;color:#5a6772;border:2px solid var(--rule);
    box-shadow:none;padding:clamp(4px,.9vh,9px) clamp(10px,1.3vw,16px);border-radius:12px;
    font-size:clamp(.8rem,2vh,.95rem);
  }
  .levels button.on{background:var(--ink);color:#fff;border-color:var(--ink);}

  /* 問題カード */
  .board{
    position:relative;flex:1 1 auto;min-height:0;
    display:flex;flex-direction:column;
    background:#fff;border:2px solid var(--rule);border-radius:18px;
    padding:clamp(6px,1.2vh,14px) 10px;
    box-shadow:0 6px 0 rgba(42,55,66,.06);
    overflow:hidden;
  }
  .area{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;}
  svg{display:block;width:100%;height:auto;}
  #nl,#viewnl{flex:1 1 0;min-height:50px;max-height:300px;width:100%;}
  .question{text-align:center;font-weight:800;font-size:clamp(.9rem,2.4vh,1.1rem);margin:2px 0;color:var(--ink);}
  .question .u{color:#6a7780;font-weight:700;}

  /* 10倍モード */
  .ops{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:0 0 clamp(2px,.8vh,10px);}
  .ops button{
    background:#eef2f4;color:#3a4750;border:2px solid var(--rule);box-shadow:none;
    padding:clamp(4px,1vh,10px) clamp(10px,1.2vw,16px);border-radius:12px;font-size:clamp(.82rem,2.2vh,1.05rem);
  }
  .ops button.on{background:var(--rand);color:#fff;border-color:var(--rand);}
  .qmul{text-align:center;font-weight:800;font-size:clamp(1rem,2.8vh,1.25rem);margin:0;}
  .mover{
    flex:1 1 0;min-height:70px;display:flex;align-items:center;justify-content:center;
    padding:2px 4px 0;
    touch-action:none;user-select:none;-webkit-user-select:none;cursor:ew-resize;
  }
  .mover svg{width:100%;height:100%;max-width:620px;}
  .draghint{text-align:center;font-size:clamp(.78rem,1.9vh,.9rem);color:#8a97a0;margin:0 0 2px;}
  .moverctl{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:0;}
  #ptReset{background:#8a97a0;}
  .mulhint{text-align:center;font-weight:800;font-size:clamp(.85rem,2.3vh,1.05rem);color:var(--hintlbl);min-height:1.3em;margin:0;}
  .revealmul{text-align:center;font-weight:900;font-size:clamp(1rem,3vh,1.3rem);color:var(--red);min-height:1.3em;margin:0;}

  /* 小数の見方 */
  /* 見方の小タブは いつも同じ場所（カードの左上）に固定する。
     ・上ぞろえ  … 下の中身の高さが変わっても 上下に動かない
     ・左ぞろえ  … 「何の位？」でこたえ欄が消えて 板がひろがっても 左右に動かない */
  #viewArea{justify-content:flex-start;}
  #viewArea .ops{justify-content:flex-start;flex:0 0 auto;}
  /* 小タブ（大タブの中の切りかえ） */
  #subtabs{flex:0 0 auto;}
  #subtabs .subs{justify-content:flex-start;flex:0 0 auto;}
  #viewBody{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;}
  /* 「水のかさ」（ますの絵） */
  #viewmasu{flex:1 1 0;min-height:90px;display:flex;justify-content:center;align-items:center;}
  #viewmasu svg{width:100%;height:100%;max-width:880px;}
  /* min-height はヒントの2行ぶん。1行のときも同じ高さを取るので、
     ヒントを出しても 上の数直線やマスが動かない。 */
  .viewq{position:relative;text-align:center;font-weight:800;font-size:clamp(1.15rem,3.3vh,1.55rem);line-height:1.9;margin:2px 4px;min-height:2.6em;}
  /* ヒントの小さい筆算（あわせた数／○より小さい）。
     ・position:absolute なので、問題文の高さは ふえない＝数直線は動かない
     ・padding-right は「あわせた数」「○より小さい」では いつも つけておく。
       こうすると ヒントを押しても 問題文が 左右に動かない。 */
  .viewq.withhis{padding-right:clamp(130px,25vh,270px);}
  .viewq .vhis{
    position:absolute;right:clamp(16px,8vh,80px);top:50%;transform:translateY(-50%);
    height:clamp(104px,20vh,208px);pointer-events:none;
  }
  .viewq .vhis svg{width:auto;height:100%;display:block;}
  /* こたえの行がない（2段の）筆算。数字の大きさが3段のときとそろうように高さを合わせる */
  .viewq .vhis.two{height:clamp(75px,14.4vh,150px);}
  .viewq .tgt{color:var(--red);}
  /* ヒントのとき 2行に分けて出す問題（0.01が□こ／数を書く）。
     左ぞろえの箱を まん中に置くので、1行目のはじめの数と 2行目のはじめの数が たてにそろう。
     行の間は つめる（下の line-height）。 */
  /* 高さは 2.6em に固定する（＝上の .viewq の min-height と同じ）。
     2行目には □（入力ます）が入り、ますは枠線と余白のぶん
     line-height(1.3)より高くなるので、高さを決めておかないと
     箱が2.6emより高くなり、上の数直線が すこし上に ずれてしまう。
     vertical-align:middle … 箱の外に よけいなすき間が出ないように。 */
  .viewq .vq2{display:inline-block;text-align:left;line-height:1.3;vertical-align:middle;height:2.6em;}
  .viewq .vq2 .ln{display:block;}
  /* 「1・0.1・0.01・0.001」＝テストと同じ 4行のならび。
       1.435 は、   1    を [□] こ、
                   0.1   を [□] こ、
                   0.01  を [□] こ、
                   0.001 を [□] こ
       あわせた数です。
     grid の5列で「を」「□」「こ」を たてにそろえる。
     1・0.1・0.01・0.001 は右ぞろえ＝小数点の下がそろって見える。 */
  .viewq .v5box{display:inline-block;text-align:left;line-height:1.3;vertical-align:middle;}
  .viewq .vq5{
    display:grid;grid-template-columns:auto auto auto auto auto;
    align-items:center;column-gap:.3em;row-gap:clamp(2px,.7vh,7px);
  }
  .viewq .vq5 .lb{padding-right:.25em;white-space:nowrap;}
  .viewq .vq5 .un{text-align:right;font-variant-numeric:tabular-nums;}
  .viewq .vq5 .vbl{width:2.4em;margin:0;}
  /* いま答えるマス（テンキーが入るところ）を 青わくで見せる */
  .viewq .vq5 .vbl.cur{border-color:var(--rand);background:#fff;}
  /* ヒントのやじるし：問題の数（1.952）の 対象のけたの下に出す。
     absolute なので 文字のならびは 1ミリも動かない。 */
  .viewq .vq5 .lb .n{position:relative;display:inline-block;}
  .viewq .vq5 .lb .v5ar{
    display:none;position:absolute;left:50%;top:1.32em;transform:translateX(-50%);
    width:.66em;height:1.2em;overflow:visible;pointer-events:none;
  }
  .viewq .vq5 .lb .n.on .v5ar{display:block;}
  /* 「数を書く」のヒント：つぎに入れる位のところに 赤い下線。
     線はいつも（すきとおった色で）引いてあるので、ヒントを押しても 文は動かない。 */
  /* 「集めた数」のヒント：0.01 の けたの 下に、こ数の けたを たてにそろえる。
       0 . 0 1  を
       9   1 0  こ 集めた数は？
     小数点の列は 2段目を からにして、はばだけ 取っておく。
     行の高さは 1.3×2＝2.6em（.viewq の min-height と同じ）なので 上の表は動かない。 */
  .viewq .v9g{
    display:inline-grid;grid-template-columns:repeat(4,auto) auto;
    line-height:1.3;vertical-align:middle;text-align:left;
  }
  .viewq .v9g .c{text-align:center;font-variant-numeric:tabular-nums;}
  .viewq .v9g .d{text-align:center;}
  .viewq .v9g .t{white-space:nowrap;padding-left:.4em;}
  .viewq .v7s{display:inline-block;border-bottom:4px solid transparent;padding-bottom:.06em;}
  .viewq .v7s.on{border-bottom-color:var(--red);}
  .viewq .v7t{white-space:nowrap;}
  .viewq .v5f{display:block;margin-top:clamp(2px,.8vh,8px);}
  .vbl{
    width:3.4em;font-family:inherit;font-weight:800;font-size:1.05em;text-align:center;
    border:2px solid var(--keyline);border-radius:8px;padding:3px 2px;margin:0 .18em;
    background:#fdfdfb;color:var(--ink);vertical-align:middle;
  }
  .vbl:focus{outline:none;border-color:var(--rand);background:#fff;}

  /* 不等号 */
  .ineqhead{text-align:center;font-weight:800;font-size:clamp(1.05rem,3.1vh,1.45rem);margin:0 0 clamp(4px,1.5vh,16px);}
  .cmp{
    text-align:center;font-weight:800;font-size:clamp(2rem,8vh,3.6rem);line-height:1.2;
    margin:clamp(4px,1.5vh,18px) 0;font-variant-numeric:tabular-nums;
  }
  .cmp .num{color:var(--ink);}
  .cmp .dg{position:relative;display:inline-block;}
  .cmp .zero{color:var(--red);}
  /* おぎなった0は いつも 場所を取っておく（ふだんは 見えないだけ）。
     → ヒントや「かくす」を押しても 数が 横に ずれない。 */
  .cmp .ghost{visibility:hidden;}
  /* うすくするところ。わくや すきまを つけると はばが 変わって 数がずれるので 色だけ変える */
  .cmp .faint{display:inline-block;color:#cdd5da;background:#eef1f3;border-radius:7px;}
  .cmp .ibox{
    display:inline-block;min-width:1.05em;margin:0 .28em;
    border:3px solid var(--keyline);border-radius:10px;color:var(--red);
    padding:0 .1em;vertical-align:2px;
  }
  .cmp .ibox.filled{border-color:var(--red);}
  .choices{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:2px 0;}
  .choices button{
    background:#fff;color:var(--ink);border:2px solid var(--keyline);
    box-shadow:0 4px 0 #e3e8eb;font-size:clamp(1.4rem,4.4vh,2rem);font-weight:900;
    width:clamp(70px,10vw,96px);padding:clamp(3px,1vh,8px) 0;border-radius:14px;
  }
  .choices button:active{box-shadow:0 1px 0 #e3e8eb;}
  .choices button.on{background:var(--rand);color:#fff;border-color:var(--rand);box-shadow:0 4px 0 rgba(0,0,0,.16);}
  /* 不等号：説明・数・えらぶボタンを 上下に はなす */
  #ineqArea .ineqhead{margin:0 0 clamp(14px,5vh,56px);}
  #ineqArea .cmp{margin:0 0 clamp(14px,5vh,56px);}
  /* kg単位：小タブ → 重さ／長さのボタン → 説明文 → 数 を はなす */
  #kgArea #kgops{margin:clamp(8px,3vh,32px) 0 clamp(8px,3vh,30px);}
  #kgArea .kghead{margin:0 0 clamp(6px,2.4vh,24px);}
  #kgArea .kgweight{margin:0 0 clamp(4px,1.5vh,14px);}
  /* 10倍：小タブ → ×10などのボタン → 問題文 を はなす */
  #mulArea #ops{margin:clamp(8px,3vh,32px) 0 clamp(8px,3vh,30px);}
  #mulArea .qmul{margin:0 0 clamp(2px,1vh,10px);}
  .ineqfb{text-align:center;font-weight:900;font-size:clamp(1.1rem,3.2vh,1.4rem);min-height:1.5em;margin:4px 0 0;}
  .ineqfb.ok{color:var(--ok);} .ineqfb.ng{color:var(--ng);} .ineqfb.neutral{color:#6a7780;font-size:1.05rem;}

  /* kg単位 */
  .kghead{text-align:center;font-weight:800;font-size:clamp(.95rem,2.6vh,1.12rem);margin:0;}
  .kgweight{text-align:center;font-weight:900;font-size:clamp(1.4rem,4.6vh,2.1rem);color:var(--ink);margin:0 0 2px;}
  #kggrid,#viewgrid{flex:1 1 0;min-height:70px;display:flex;justify-content:center;align-items:center;}
  #kggrid svg,#viewgrid svg{width:100%;height:100%;max-width:520px;}
  .choices.words button{width:auto;padding:clamp(3px,1vh,8px) clamp(8px,1.2vw,14px);font-size:clamp(.95rem,2.8vh,1.25rem);}

  /* はなまる */
  .maru{
    position:absolute;inset:0;display:flex;
    align-items:center;justify-content:center;
    pointer-events:none;z-index:5;
    opacity:0;visibility:hidden;
    transition:opacity .55s ease, visibility .55s ease;
  }
  .maru.show{opacity:1;visibility:visible;transition:opacity .12s ease, visibility 0s;}
  .maru img{
    width:46%;max-width:240px;max-height:85%;height:auto;object-fit:contain;
    filter:drop-shadow(0 6px 14px rgba(224,36,36,.25));
  }
  .maru.show img{animation:pop .5s cubic-bezier(.18,1.5,.4,1) both;}
  @keyframes pop{
    0%{transform:scale(.2) rotate(-18deg);opacity:0;}
    60%{transform:scale(1.12) rotate(6deg);opacity:1;}
    100%{transform:scale(1) rotate(0);opacity:1;}
  }
  @media(prefers-reduced-motion:reduce){ .maru img{animation:none;} }
  /* ばつ（まちがい）※はなまると同じ動き・音なし */
  .batsu{
    position:absolute;inset:0;display:flex;
    align-items:center;justify-content:center;
    pointer-events:none;z-index:5;
    opacity:0;visibility:hidden;
    transition:opacity .55s ease, visibility .55s ease;
  }
  .batsu.show{opacity:1;visibility:visible;transition:opacity .12s ease, visibility 0s;}
  .batsu svg{ width:40%;max-width:200px;max-height:75%;height:auto;
    filter:drop-shadow(0 6px 14px rgba(224,36,36,.25)); }
  .batsu.show svg{ animation:pop .5s cubic-bezier(.18,1.5,.4,1) both; }
  @media(prefers-reduced-motion:reduce){ .batsu svg{animation:none;} }

  /* ボタン列 */
  .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:0;flex:0 0 auto;}
  .row:empty{display:none !important;}
  /* 10倍タブは ヒントボタンをやめたので、下のボタン列ごと出さない
     （ヒントを もどしたくなったら この1行を消して、#rowMul にボタンを入れる） */
  #rowMul{display:none !important;}
  button{
    font-family:inherit;cursor:pointer;border:none;border-radius:14px;
    font-weight:800;color:#fff;
    padding:clamp(6px,1.5vh,13px) clamp(12px,1.4vw,18px);font-size:clamp(.82rem,2.2vh,1rem);
    box-shadow:0 4px 0 rgba(0,0,0,.16);transition:transform .04s, box-shadow .04s;
    -webkit-tap-highlight-color:transparent;
  }
  button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.16);}
  button:focus-visible{outline:3px solid #2a3742;outline-offset:2px;}
  .b-hint{background:var(--hint);color:#5a4a00;}
  .b-hint.on{background:#ffbf1f;color:#5a4a00;box-shadow:inset 0 0 0 3px #fff,0 4px 0 rgba(0,0,0,.16);}
  .b-rand{background:var(--rand);}
  .b-regen{background:var(--regen);}
  .b-reveal{background:#8a97a0;}
  /* 文字が変わるボタン（ヒント・はば）は、いちばん長いラベルの幅で場所をとっておく。
     → 押しても となりのボタンの位置が動かない。 */
  .fixw{display:grid;min-width:0;}
  .fixw>span{grid-area:1/1;justify-self:center;align-self:center;}
  .fixw>.gh{visibility:hidden;pointer-events:none;}

  /* こたえ欄 */
  .answer{
    min-height:0;display:flex;flex-direction:column;gap:clamp(4px,1vh,10px);
    background:#fff;border:2px solid var(--rule);border-radius:18px;
    padding:clamp(8px,1.4vh,16px);box-shadow:0 6px 0 rgba(42,55,66,.06);
  }
  .answer .lbl{font-weight:800;font-size:clamp(.85rem,2.1vh,1rem);margin:0;}
  .ansline{display:flex;gap:8px;align-items:stretch;flex-wrap:wrap;}
  #ans{
    flex:1 1 120px;min-width:0;font-family:inherit;font-weight:800;
    font-size:clamp(1.4rem,4.4vh,2rem);text-align:center;letter-spacing:.04em;
    padding:clamp(3px,1vh,10px) 8px;border:3px solid var(--keyline);border-radius:14px;
    background:#fdfdfb;color:var(--ink);
  }
  #ans:focus{outline:none;border-color:var(--rand);}
  .ansline .unit{display:flex;align-items:center;font-weight:800;font-size:clamp(1.1rem,3vh,1.4rem);color:#6a7780;padding:0 4px;}
  /* 「こたえあわせ」は たてを 少し広め（押しやすく）。
     左右の padding は ふつうのボタンのまま（せまい画面の指定とぶつからないよう 上下だけ書く） */
  .b-check{
    background:var(--check);flex:1 1 100%;font-size:clamp(.9rem,2.4vh,1.05rem);
    padding-top:clamp(9px,2.3vh,20px);padding-bottom:clamp(9px,2.3vh,20px);
  }

  /* テンキー（残りの高さいっぱいに広がる） */
  .keys{flex:1 1 auto;min-height:0;max-height:520px;display:flex;flex-direction:column;gap:clamp(5px,1vh,10px);}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:1fr;gap:clamp(5px,1vh,10px);flex:4 1 0;min-height:0;}
  .pad2{grid-template-columns:1fr;flex:.68 1 0;}   /* 「ぜんぶけす」だけ（少し低め）。こたえを見るは廃止 */
  .pad3{grid-template-columns:repeat(2,1fr);flex:.68 1 0;}  /* ＋／－（文しょうだいのときだけ） */
  #padnext{grid-template-columns:1fr;}
  #padnext button{font-size:clamp(.82rem,2.2vh,1.05rem);background:#eaf2fc;border-color:#bcd0ef;}
  .pad button{
    background:var(--key);color:var(--ink);font-size:clamp(1.1rem,3.6vh,1.6rem);padding:0;min-height:0;
    border:2px solid var(--keyline);box-shadow:0 4px 0 #e3e8eb;
  }
  .pad button:active{box-shadow:0 1px 0 #e3e8eb;}
  .pad2 button{font-size:clamp(.82rem,2.2vh,1rem);}
  .pad .k-dot{color:var(--red);}
  .pad .k-op{color:var(--rand);font-weight:900;}
  .pad .k-back{color:#6a7780;}
  .pad .k-clear{background:#fdeee9;color:var(--ng);border-color:#f3cdc0;box-shadow:0 4px 0 #f0d6cb;}
  .pad .b-reveal{background:#8a97a0;color:#fff;border-color:#8a97a0;box-shadow:0 4px 0 rgba(0,0,0,.16);}

  /* 筆算 */
  /* たし算／ひき算の行 → 形の行 → 説明文 を 上下に はなす（低い画面では自動でせまくなる） */
  /* ★ボタン2行は いつも いちばん上に 固定する。
     下の #hisbody だけが のこりの高さを もらって、その中で 中央ぞろえ。
     → 「筆算」「横式」などを 押しても ボタンが 上下に 動かない。 */
  #hisArea{justify-content:flex-start;}
  #hisArea #hisops{flex:0 0 auto;}
  #hisbody{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;}
  #hisArea #hisops{margin:clamp(8px,3vh,32px) 0 clamp(8px,3vh,30px);}
  /* 指示の文。中身と 少しはなして、上のほうに 置く */
  .hishead{text-align:center;font-weight:800;font-size:clamp(.95rem,2.6vh,1.15rem);line-height:1.7;
           margin:0 0 clamp(12px,4.5vh,50px);}
  /* 文しょうだいの文（大きめ・「。」で2行） */
  .hisword{text-align:center;font-weight:800;font-size:clamp(1.05rem,3.4vh,1.6rem);line-height:1.8;margin:0 4px;}
  .hisword .hwbox{display:inline-block;text-align:left;}
  .hisword .hwbox .ln{display:block;}
  /* 0.01をもとに（大きめ） */
  .hisbase{text-align:center;font-weight:800;font-size:clamp(.98rem,3vh,1.42rem);line-height:1.8;margin:0 4px;}
  .hisbase .vbl{width:3.2em;}
  /* 「まず・次に・だから」を左の列に、中身を右の列に。
     2行目・6行目は 左の列が からなので、上の行の 中身と 頭がそろう。 */
  /* 左＝説明文（いつも同じ形）／右＝ヒントのパネル。
     右がわは 中身が なくても はばを 取っておくので、ヒントを出しても 左の文は 動かない。 */
  .hisbase .hbwrap{display:inline-flex;align-items:center;gap:clamp(10px,2.4vw,40px);}
  .hisbase .hb{display:inline-grid;grid-template-columns:auto auto;position:relative;
               align-items:center;text-align:left;row-gap:clamp(2px,.9vh,10px);column-gap:.15em;}
  .hisbase .hb .hb-full{grid-column:1/-1;}
  .hisbase .hb .hb-l{white-space:nowrap;}
  .hisbase .hb .hb-c{white-space:nowrap;}
  .hisbase .hbside{flex:0 0 auto;width:clamp(150px,21vw,340px);text-align:left;}
  .hisbase .hbcard{
    background:#fffbe8;border:2px solid #ffe3a3;border-radius:14px;
    padding:.6em .75em;font-size:.95em;line-height:1.6;
    text-align:center;                 /* 中身のかたまりを まん中に置く（右があきすぎない） */
  }
  /* 中身は 左ぞろえのまま、かたまりごと 中央へ */
  .hisbase .hbcard .hbin{display:inline-block;text-align:left;}
  .hisbase .hbcard .ht{font-weight:900;color:#8a6d00;margin-bottom:.4em;}
  .hisbase .hbcard .hl{white-space:nowrap;}
  /* いま 書く □（青いわく。ycell.cur と 同じ考え方） */
  .hisbase .vbl.cur{border-color:var(--rand);background:#fff;}
  /* □②のヒント：「次に」の答えを 赤わくで囲む（わくを つけても 数は動かない） */
  .hisbase .hbsum{display:inline-block;border-radius:7px;}
  .hisbase .hbsum.on{outline:3px solid var(--red);outline-offset:3px;}
  /* □②のヒント：□へ ひく 赤いやじるし */
  .hisbase .hbarrow{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;}
  /* □③のヒント：0.01 の けたの下に こ数の けたを そろえる（「集めた数」と同じ形） */
  .hisbase .hbg{display:inline-grid;line-height:1.35;vertical-align:middle;text-align:left;}
  .hisbase .hbg .c{text-align:center;min-width:.7em;font-variant-numeric:tabular-nums;}
  .hisbase .hbg .d{text-align:center;}
  .hisbase .hbg .t{white-space:nowrap;padding-left:.35em;}
  /* 横式→筆算（選ぶ）：2つの筆算から 正しいほうを クリックする */
  .pickwrap{display:flex;justify-content:center;align-items:flex-start;
            gap:clamp(14px,5vw,70px);flex-wrap:wrap;margin-top:clamp(16px,4.5vh,46px);
            --pw:1.05em;--pdw:.42em;}
  .pickbox{
    background:#fdfdfb;border:3px dashed var(--keyline);border-radius:16px;
    padding:clamp(8px,1.8vh,20px) clamp(10px,2vw,24px);cursor:pointer;font-family:inherit;
    color:var(--ink);box-shadow:none;   /* 共通の button{color:#fff} を 打ち消す */
  }
  .pickbox:active{transform:none;box-shadow:none;}
  .pickbox:hover{border-color:var(--rand);}
  .pickbox.ok{border-style:solid;border-color:var(--ok);background:#f1fbf5;}
  .pickbox.ng{border-style:solid;border-color:var(--ng);background:#fdf3f1;}
  .pgrid{display:inline-block;position:relative;font-weight:900;line-height:1.15;
         font-size:clamp(1.3rem,4.4vh,2.2rem);}
  .pgrid .prow{display:flex;align-items:baseline;}
  .pgrid .ps{width:.95em;text-align:center;flex:0 0 auto;}
  .pgrid .pbody{display:flex;align-items:baseline;flex:0 0 auto;}
  /* 数字は 1つずつ マスに入る。小数点は マスとマスの あいだ（せまい はば）*/
  .pgrid .pc{width:var(--pw);text-align:center;font-variant-numeric:tabular-nums;flex:0 0 auto;}
  .pgrid .pdt{width:var(--pdw);text-align:center;flex:0 0 auto;}
  .pgrid .pgap,.pgrid .pend{flex:0 0 auto;}
  .pickwrap.hint .pgrid .pd{color:var(--red);}
  .pgrid .pline{display:block;border-top:4px solid var(--ink);margin-top:.08em;}
  /* こたえを 書く ぶんの あき（数字は 書かない） */
  .pgrid .pans{display:block;height:1.15em;}
  /* 小数点の 高さ（文字の ベースライン）を 測るための 目印。大きさは 0 なので 見えない */
  .pgrid .pba{display:inline-block;width:0;height:0;vertical-align:baseline;}
  /* ヒント：上の数と 下の数の 小数点を むすぶ 赤い線 */
  .pgrid .pdline{position:absolute;left:0;top:0;pointer-events:none;overflow:visible;}
  .histip{text-align:center;font-weight:800;font-size:clamp(.85rem,2.4vh,1.1rem);color:#6a7780;line-height:1.6;margin:clamp(2px,1vh,10px) 4px 0;}
  .hisexpr{text-align:center;font-weight:900;font-size:clamp(1.3rem,4.4vh,2.1rem);margin:clamp(3px,1.2vh,12px) 0;letter-spacing:.02em;}
  #hisgrid{flex:1 1 0;min-height:80px;display:flex;justify-content:center;align-items:center;}
  #hisgrid svg{width:100%;height:100%;max-width:380px;}   /* 筆算の大きさ（数字を小さくしたいときは この数字） */
  #hisgrid svg.dlines{max-width:none;}                    /* くり下がりの斜線は 大きさを そろえない */

  /* 横式 → 筆算に なおす（マスに 数を入れる） */
  #yokowrap{flex:1 1 0;min-height:90px;display:flex;justify-content:center;align-items:center;}
  .ygrid{
    display:inline-grid;justify-content:center;align-items:center;
    font-size:clamp(1.4rem,4.8vh,2.4rem);font-weight:900;line-height:1;
    column-gap:.03em;row-gap:.14em;
    --yw:1.3em;--ydot:.3em;
  }
  .ygrid .ysign{text-align:right;font-size:.86em;padding-right:.06em;}
  .ygrid .ydot{text-align:center;color:var(--ink);}
  .ygrid .ylab{font-size:.38em;font-weight:800;color:#6a7780;text-align:center;white-space:nowrap;}
  .ygrid .ycell{
    width:var(--yw);font-size:.86em;padding:2px 0;margin:0;
    border:2px dashed var(--keyline);border-radius:8px;background:#fdfdfb;
  }
  .ygrid .ycell.cur{border-style:solid;border-color:var(--rand);background:#fff;}
  .ygrid .ycell::placeholder{color:#d9c2b8;opacity:1;}   /* ヒントの 見えない0 */
  .ygrid .ycell.ng{border-style:solid;border-color:var(--ng);}
  /* ここから「筆算」タブ（#hgrid）用 */
  .ygrid .ydig{width:var(--yw);font-size:.86em;text-align:center;padding:2px 0;}
  .ygrid .sgc{text-align:right;padding-right:.06em;}      /* ＋／− は 下の数の すぐ 左に */
  .ygrid .ydig.faint,.ygrid .ydot.faint{color:#d9c2b8;}   /* ヒントの おぎなう0 */
  /* くり上がり・くり下がりの 小さなメモ欄（採点しない） */
  .ygrid .mcell{
    width:var(--yw);font-family:inherit;font-weight:800;font-size:.34em;text-align:center;
    padding:1px 0;margin:0;color:var(--red);background:transparent;
    border:2px dashed transparent;border-radius:6px;
  }
  .ygrid .mcell:hover{border-color:#e1e7ea;}
  .ygrid .mcell.cur{border-style:solid;border-color:var(--rand);}
  .ygrid .mdot{font-size:.34em;}
  /* くり上がりの 1 … こたえの マスの 右上（横線の すぐ下）に 小さく 出す */
  .ygrid .hwrap{position:relative;display:flex;width:var(--yw);margin-top:.16em;}
  .ygrid .adot{margin-top:.16em;}                         /* こたえの 小数点も いっしょに 下げる */
  .ygrid .ccell{
    position:absolute;right:.12em;top:-.72em;width:1.2em;
    font-family:inherit;font-weight:800;font-size:.46em;line-height:1;text-align:center;
    padding:0;margin:0;border:0;background:transparent;color:var(--red);
    pointer-events:none;
  }
  .ygrid .hcell{color:var(--ink);}                        /* こたえは 黒（えんぴつと同じ） */
  /* こたえあわせで うしろの0に 引く 斜線（左上→右下） */
  .ygrid .zx{
    position:absolute;left:-1px;top:-1px;right:-1px;bottom:-1px;border-radius:8px;
    pointer-events:none;opacity:0;transition:opacity .16s;
    background:linear-gradient(to top right,
      transparent calc(50% - 1.6px), var(--red) calc(50% - 1.6px),
      var(--red) calc(50% + 1.6px), transparent calc(50% + 1.6px));
  }
  .ygrid .zx.on{opacity:1;}
  /* ひき算の ヒント（くり下がり）… 上の数に 書きこむ 小さな 数字と 斜線 */
  #hgrid{position:relative;}
  .ygrid .dwrap{position:relative;}
  .ygrid .dtop,.ygrid .dsub{
    position:absolute;font-family:inherit;font-weight:800;color:var(--ink);
    line-height:1;white-space:nowrap;pointer-events:none;
  }
  .ygrid .dtop{left:0;right:0;top:-52%;font-size:.56em;text-align:center;}
  .ygrid .dsub{left:8%;top:6%;font-size:.5em;}
  .ygrid .dlines{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none;}
  .ygrid .dlines line{stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;}
  #hgrid{font-size:clamp(1.8rem,7vh,3.2rem);}             /* 筆算タブは 大きめ */
  .ygrid .yline{grid-column:1/-1;border-top:4px solid var(--ink);margin-top:.06em;}

  /* まちがいさがし … こたえの マスを クリックして なおす */
  #mgrid{position:relative;font-size:clamp(1.8rem,7vh,3.2rem);}
  .ygrid .mans{
    width:var(--yw);font-size:.86em;text-align:center;padding:2px 0;line-height:1.1;
    color:var(--ink);border:2px solid transparent;border-radius:8px;
    cursor:pointer;background:transparent;
    transition:background .14s,border-color .14s,color .14s;
    -webkit-tap-highlight-color:transparent;
  }
  .ygrid .mans.empty{border-color:transparent;background:transparent;}
  /* 数字が 入っていない マスは 数字と 同じ 大きさの 正方形で 見せる */
  .ygrid .mans.empty::before{
    content:"";display:block;margin:0 auto;width:1.05em;height:1.05em;
    border:2px dashed var(--keyline);border-radius:8px;background:#fdfdfb;
  }
  .ygrid .mans:hover{background:#eaf3fb;}
  .ygrid .mans.hint{border-color:var(--hint);background:#fff8dd;}
  .ygrid .mans.ng{border-color:var(--ng);background:#fdeeea;}
  .ygrid .mans.fix{color:var(--ok);animation:mpop .5s ease-out;}
  @keyframes mpop{0%{transform:scale(.4);opacity:.2}60%{transform:scale(1.25)}100%{transform:scale(1)}}
  .ygrid .dtop.fix,.ygrid .dsub.fix{animation:mpop .5s ease-out;}

  /* 末尾の0に斜線（左上→右下）＝テストの○つけと同じ */
  .zcut{position:relative;display:inline-block;color:#aeb8bd;}
  .zcut::after{
    content:"";position:absolute;left:-1px;top:-4px;right:-1px;bottom:-4px;
    background:linear-gradient(to top right,
      transparent calc(50% - 1.6px), var(--red) calc(50% - 1.6px),
      var(--red) calc(50% + 1.6px), transparent calc(50% + 1.6px));
  }
  .zhint{display:block;font-size:.6em;font-weight:800;color:#6a7780;line-height:1.3;}

  /* 10問チャレンジ（challenge10 のCSSを、このアプリの大きさに合わせる）*/
  .top #chal-wrap{gap:8px;}
  #chal-wrap .chal-btn{
    font-size:clamp(.72rem,1.8vh,.9rem);padding:clamp(3px,.8vh,8px) clamp(8px,1.2vw,14px);
    border-radius:12px;white-space:nowrap;
  }
  #chal-wrap #chal-bar{
    padding:clamp(3px,.7vh,6px) clamp(8px,1.2vw,14px);gap:8px;
    font-size:clamp(.72rem,1.8vh,.9rem);box-shadow:none;border:2px solid #e2cdea;
  }
  #chal-wrap #chal-dots{font-size:clamp(.78rem,2vh,1.02rem);letter-spacing:1px;}
  @media (max-width: 640px){
    #chal-wrap .chal-btn{font-size:.72rem;padding:4px 8px;}
    #chal-wrap #chal-bar{font-size:.7rem;padding:3px 8px;}
  }

  /* 正誤メッセージ */
  .fb{min-height:1.4em;text-align:center;font-weight:900;font-size:clamp(1.05rem,3vh,1.5rem);margin:0;}
  .fb.ok{color:var(--ok);}
  .fb.ng{color:var(--ng);}
  .fb.neutral{color:#6a7780;font-size:clamp(.85rem,2.2vh,1.05rem);}

  /* 縦長・せまい画面：上＝問題 / 下＝こたえ（テンキーは6列×2段） */
  @media (max-aspect-ratio: 5/6), (max-width: 640px){
    .wrap{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;}
    .wrap.noans{grid-template-rows:minmax(0,1fr);}
    .b-check{flex:0 0 auto;padding-left:16px;padding-right:16px;}
    .keys{flex:none;height:clamp(96px,21vh,230px);}
    .pad{grid-template-columns:repeat(6,1fr);flex:2 1 0;}
    .pad2{grid-template-columns:1fr;flex:.7 1 0;}
    .pad3{grid-template-columns:repeat(2,1fr);flex:.7 1 0;}
    .answer{gap:clamp(3px,.8vh,8px);}
  }
  /* スマホなど、とくにせまい画面 */
  @media (max-width: 640px){
    h1{font-size:.9rem;}
    .levels{gap:4px;}
    .levels button{padding:4px 7px;font-size:.76rem;border-radius:9px;}
    .ops{gap:4px;}
    .ops button{padding:4px 7px;font-size:.78rem;}
    .row{flex-wrap:nowrap;gap:6px;}
    .row button{flex:1 1 0;padding:6px 4px;font-size:.76rem;line-height:1.25;}
    .viewq{font-size:.88rem;line-height:1.75;}
    .viewq.withhis{padding-right:clamp(84px,30vw,150px);}
    .viewq .vhis{right:clamp(6px,4vw,26px);height:clamp(76px,15vh,136px);}
    .viewq .vhis.two{height:clamp(55px,10.8vh,98px);}
    .viewq .vq5{column-gap:.22em;}
    .viewq .vq5 .vbl{width:2.2em;}
    .keys{height:clamp(90px,19vh,200px);}
    .cmp{font-size:clamp(1.6rem,9vw,3rem);}
    .hisword{font-size:1rem;line-height:1.7;}
    .hisbase{font-size:.94rem;line-height:1.8;}
    .hisbase .vbl{width:2.9em;}
    .ygrid{font-size:clamp(1.15rem,7vw,1.8rem);}
  }
</style>
</head>
<body>
<div class="wrap">
 <div class="main">
  <div class="top">
  <h1>４年小数</h1>
  <div class="levels">
    <button id="tabRep" class="on">小数の表し方</button>
    <button id="tabSys">小数のしくみ</button>
    <button id="tab2">数直線</button>
    <button id="tabHis">筆算</button>
    <button id="tab4">小数の見方</button>
    <button id="tabThink">考える</button>
  </div>
  <div id="chal-mount"></div>
  </div>
  <p class="sub" id="sub">矢印（↑）がさす めもりは 何mかな？ 1めもりは 0.001 です。</p>

  <div class="board">
    <div id="subtabs">
      <div class="ops subs" id="nops" style="display:none">
        <button data-sub="nl1" class="on">かんたん</button>
        <button data-sub="nl2">難しい</button>
        <button data-sub="rand">ランダム</button>
      </div>
      <div class="ops subs" id="rops">
        <button data-sub="v8" class="on">水のかさ</button>
        <button data-sub="kg">kg単位</button>
        <button data-sub="v7">合わせた数</button>
        <button data-sub="rand">ランダム</button>
      </div>
      <div class="ops subs" id="sops" style="display:none">
        <button data-sub="v5">小数の位取り</button>
        <button data-sub="v6">何の位？</button>
        <button data-sub="v9">集めた数</button>
        <button data-sub="ineq">不等号</button>
        <button data-sub="mul">10倍</button>
        <button data-sub="rand">ランダム</button>
      </div>
      <div class="ops subs" id="hops" style="display:none">
        <button data-sub="tate" class="on">計算する</button>
        <button data-sub="pick">横式→筆算（選ぶ）</button>
        <button data-sub="yoko">横式→筆算（書く）</button>
        <button data-sub="miss">まちがいさがし</button>
        <button data-sub="rand">ランダム</button>
      </div>
      <div class="ops subs" id="vops" style="display:none">
        <button data-sub="v1">あわせた数</button>
        <button data-sub="v2">○より小さい</button>
        <button data-sub="v3">0.01が□こ</button>
        <button data-sub="rand">ランダム</button>
      </div>
      <div class="ops subs" id="tops" style="display:none">
        <button data-sub="word">文しょうだい</button>
        <button data-sub="base">0.01をもとに</button>
        <button data-sub="rand">ランダム</button>
      </div>
    </div>
    <div class="area" id="nlArea">
      <svg id="nl" viewBox="0 0 1060 220" role="img" aria-label="数直線"></svg>
      <p class="question">↑ の めもりは <span class="u">何 m</span> ？</p>
    </div>

    <div class="area" id="mulArea" style="display:none">
      <div class="ops" id="ops">
        <button data-op="x10" class="on">×10</button>
        <button data-op="x100">×100</button>
        <button data-op="d10">1/10</button>
        <button data-op="d100">1/100</button>
        <button data-op="rand">ランダム</button>
      </div>
      <p class="qmul" id="qmul"></p>
      <p class="mulhint" id="mulhint"></p>
      <div class="mover" id="mover"></div>
      <p class="draghint" id="draghint">小数点（<span style="color:var(--red);font-weight:900">.</span>）を 左右に ドラッグ してね</p>
      <div class="moverctl">
        <button id="ptReset">もとにもどす</button>
      </div>
      <p class="revealmul" id="revealmul"></p>
    </div>

    <div class="area" id="viewArea" style="display:none">
      <div class="vbody" id="viewBody">
        <svg id="viewnl" viewBox="0 0 1040 200" role="img" aria-label="数直線"></svg>
        <div id="viewmasu" style="display:none"></div>
        <div id="viewgrid" style="display:none"></div>
        <p class="viewq" id="viewq"></p>
        <div class="choices words" id="viewChoices" style="display:none">
          <button data-pl="0">一の位</button>
          <button data-pl="1">1/10の位</button>
          <button data-pl="2">1/100の位</button>
          <button data-pl="3">1/1000の位</button>
        </div>
        <p class="ineqfb" id="viewfb" style="display:none"></p>
        <p class="revealmul" id="viewreveal"></p>
      </div>
    </div>

    <div class="area" id="ineqArea" style="display:none">
      <p class="ineqhead">□ に あてはまる 不等号を えらびましょう。</p>
      <div class="cmp" id="cmp"></div>
      <div class="choices" id="ineqChoices">
        <button data-sym="&gt;">＞</button>
        <button data-sym="=">＝</button>
        <button data-sym="&lt;">＜</button>
      </div>
      <p class="ineqfb" id="ineqfb"></p>
    </div>

    <div class="area" id="kgArea" style="display:none">
      <div class="ops" id="kgops">
        <button data-ku="kg" class="on">重さ（kg）</button>
        <button data-ku="km">長さ（km）</button>
        <button data-ku="rand">ランダム</button>
      </div>
      <p class="kghead" id="kghead">下の 重さを kg で あらわしましょう。</p>
      <p class="kgweight" id="kgweight"></p>
      <div id="kggrid"></div>
      <p class="revealmul" id="kgreveal"></p>
    </div>

    <div class="area" id="hisArea" style="display:none">
      <div class="ops" id="hisops">
        <button data-ho="add" class="on">たし算</button>
        <button data-ho="sub">ひき算</button>
        <button data-ho="rand">ランダム</button>
      </div>
      <!-- ここから下だけが 形によって 入れかわる。
           「たし算／ひき算」の行（#hisops）は いつも 上に 固定。 -->
      <div id="hisbody">

<script>
/* ===== challenge10.js をそのまま入れてあります（1ファイルで動かすため） ===== */
/* ============================================================
   challenge10.js  —  「10問チャレンジ」だけを取り出したもの
   ------------------------------------------------------------
   もと：warizan81_kangae.html（小数のかけ算とわり算の筆算）⑪81
   どんなアプリでも使えるように、CSS と HTML も中に入れてあります。
   ほかのファイルは いりません（ライブラリなし・ネットもいらない）。

   ■ 使いかた（3つ呼ぶだけ）
     1. Challenge10.init({ mount: '#どこか', next: () => 次の問題を出す関数() })
     2. 1問できたら          Challenge10.done()
     3. まちがえたら          Challenge10.miss()

   ■ そのほか
     Challenge10.newProblem()  … 新しい問題を出したとき（その問題のミス数を0に）
     Challenge10.reset()       … 数えなおす（タブを変えたときなど）
     Challenge10.isOn()        … いまチャレンジ中か
     Challenge10.stop()        … チャレンジをやめる
     Challenge10.state         … {on, total, no, miss, missNow, perfect, t0}

   ■ init に わたせるもの（ぜんぶ省略できます）
     mount       ボタンを置く場所。'#id' か 要素。省略すると <body> の先頭
     total       何問にするか（初期値 10）
     next        次の問題を出す関数。これがないと自動で次に進みません
     nextDelay   はなまるから次の問題までの待ち時間 ms（初期値 1800）
     resultDelay 最後の問題から成せき表までの待ち時間 ms（初期値 1500）
     label       ボタンの文字（初期値 '🏁 10問チャレンジ'）
     sound       ボタンを押したとき鳴らす関数（例: () => playSound('click')）
     onToggle    on/off が変わったとき呼ばれる関数 (on) => {}
     onFinish    10問おわったとき呼ばれる関数 (成せき) => {}
     record      true にすると、その日の最高記録を localStorage に残す
     recordKey   記録の名前（アプリごとに変える。初期値 'challenge10'）
     css         false にすると 見た目のCSSを入れない（自分で書くとき）
   ============================================================ */
(function (global) {
    'use strict';

    var CSS = `
    .chal-btn {
        font-size: 1rem; font-weight: bold; color: #6a1b9a;
        background: #f3e5f5; border: 2px solid #ce93d8; border-radius: 20px;
        padding: 7px 16px; box-shadow: 0 2px 0 #ce93d8; cursor: pointer;
        font-family: inherit;
    }
    .chal-btn.on { color: #fff; background: #8e24aa; border-color: #6a1b9a; box-shadow: 0 2px 0 #4a148c; }
    .chal-btn:focus-visible, .chal-btns button:focus-visible { outline: 3px solid #8e24aa; outline-offset: 2px; }
    #chal-bar {
        display: none; align-items: center; gap: 10px;
        background: rgba(255,255,255,0.9); border-radius: 20px; padding: 6px 16px;
        box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        font-weight: bold; color: #6a1b9a; white-space: nowrap;
    }
    #chal-dots { color: #8e24aa; letter-spacing: 2px; font-size: 1.05rem; }
    #chal-wrap { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    /* おわったときの成せき表 */
    #chal-result {
        display: none; position: fixed; left: 0; top: 0; right: 0; bottom: 0;
        background: rgba(0,0,0,0.45); z-index: 900;
        align-items: center; justify-content: center;
    }
    #chal-result.show { display: flex; }
    .chal-card {
        background: #fff; border-radius: 20px; padding: 28px 34px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.3); text-align: center; max-width: 90vw;
    }
    .chal-title { font-size: 1.8rem; font-weight: bold; color: #8e24aa; margin-bottom: 14px; }
    .chal-lines { font-size: 1.25rem; font-weight: bold; color: #333; line-height: 2; }
    .chal-lines b { color: #e53935; font-size: 1.5rem; }
    .chal-msg { margin-top: 10px; color: #ff6f00; }
    .chal-best { margin-top: 6px; font-size: 1rem; color: #6a1b9a; }
    .chal-btns { display: flex; gap: 12px; justify-content: center; margin-top: 20px; }
    .chal-btns button {
        padding: 12px 20px; font-size: 1.1rem; font-weight: bold; font-family: inherit;
        border-radius: 14px; cursor: pointer; border: none;
    }
    #btn-chal-again { color: #fff; background: #8e24aa; box-shadow: 0 3px 0 #4a148c; }
    #btn-chal-quit  { color: #6a1b9a; background: #f3e5f5; border: 2px solid #ce93d8; }
    @media (prefers-reduced-motion: reduce) { .chal-btn, .chal-btns button { transition: none; } }
    `;

    var BAR_HTML =
        '<button id="btn-challenge" class="chal-btn" type="button"></button>' +
        '<div id="chal-bar"><span id="chal-dots"></span><span id="chal-count"></span></div>';

    var RESULT_HTML =
        '<div class="chal-card">' +
        '  <div class="chal-title">🏁 <span id="chal-total-title"></span>問 できました！</div>' +
        '  <div class="chal-lines" id="chal-lines"></div>' +
        '  <div class="chal-btns">' +
        '    <button id="btn-chal-again" type="button">もう一度チャレンジ</button>' +
        '    <button id="btn-chal-quit" type="button">やめる</button>' +
        '  </div>' +
        '</div>';

    var cfg = null;
    var chal = { on: false, total: 10, no: 0, miss: 0, missNow: 0, perfect: 0, t0: 0 };
    var $ = function (id) { return document.getElementById(id); };

    // --- きょうの記録（localStorage。使えないときは だまって何もしない）---
    function todayKey() {
        var d = new Date();
        return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate();
    }
    function loadBest() {
        if (!cfg.record) return null;
        try {
            var raw = localStorage.getItem(cfg.recordKey);
            if (!raw) return null;
            var o = JSON.parse(raw);
            // その日の記録だけ／問題数がちがう記録はまぜない
            return (o && o.day === todayKey() && o.total === chal.total) ? o : null;
        } catch (e) { return null; }
    }
    function saveBest(perfect, sec) {
        if (!cfg.record) return null;
        var best = loadBest();
        // ノーミスの数が多いほうが上。同じなら 時間が短いほう
        if (best && (best.perfect > perfect || (best.perfect === perfect && best.sec <= sec))) return best;
        var o = { day: todayKey(), perfect: perfect, sec: sec, total: chal.total };
        try { localStorage.setItem(cfg.recordKey, JSON.stringify(o)); } catch (e) { }
        return o;
    }

    // --- 帯（○○○●…）の書きかえ ---
    function chalUpdateBar() {
        $('btn-challenge').classList.toggle('on', chal.on);
        $('chal-bar').style.display = chal.on ? 'flex' : 'none';
        if (!chal.on) return;
        var dots = '';
        for (var i = 0; i < chal.total; i++) dots += (i < chal.no) ? '●' : '○';
        $('chal-dots').innerText = dots;
        $('chal-count').innerText = Math.min(chal.no + 1, chal.total) + '問め / ' + chal.total;
    }

    // --- はじめから数えなおす ---
    function chalReset() {
        chal.no = 0; chal.miss = 0; chal.missNow = 0; chal.perfect = 0; chal.t0 = Date.now();
        $('chal-result').classList.remove('show');
        chalUpdateBar();
    }

    // --- 1問おわったときに呼ぶ ---
    function chalDone() {
        if (!chal.on) return;
        if (chal.missNow === 0) chal.perfect++;
        chal.no++;
        chalUpdateBar();
        if (chal.no < chal.total) {
            setTimeout(function () {         // つぎの問題へ
                if (!chal.on) return;
                chal.missNow = 0;
                if (cfg.next) cfg.next();
            }, cfg.nextDelay);
            return;
        }
        var sec = Math.floor((Date.now() - chal.t0) / 1000);
        var msg = (chal.perfect === chal.total) ? 'ぜんぶノーミス！ すばらしい！'
                : (chal.perfect >= chal.total - 2) ? 'よくがんばりました！'
                : 'つぎは もっとできる！';
        var best = saveBest(chal.perfect, sec);
        var result = { perfect: chal.perfect, miss: chal.miss, sec: sec, total: chal.total };
        setTimeout(function () {
            $('chal-total-title').innerText = chal.total;
            $('chal-lines').innerHTML =
                '<div>ノーミスでできた問題　<b>' + chal.perfect + '</b> / ' + chal.total + '</div>' +
                '<div>まちがえた回数　<b>' + chal.miss + '</b> 回</div>' +
                '<div>かかった時間　<b>' + Math.floor(sec / 60) + '</b> 分 <b>' + (sec % 60) + '</b> 秒</div>' +
                '<div class="chal-msg">' + msg + '</div>' +
                (best ? '<div class="chal-best">きょうの最高記録　ノーミス ' + best.perfect + ' / ' + best.total +
                        ' 問　　' + Math.floor(best.sec / 60) + '分' + (best.sec % 60) + '秒</div>' : '');
            $('chal-result').classList.add('show');
            $('btn-chal-again').focus();
            if (cfg.onFinish) cfg.onFinish(result);
        }, cfg.resultDelay);
    }

    // --- はじめの用意 ---
    function init(opt) {
        opt = opt || {};
        cfg = {
            total: opt.total || 10,
            next: opt.next || null,
            nextDelay: (opt.nextDelay === undefined) ? 1800 : opt.nextDelay,
            resultDelay: (opt.resultDelay === undefined) ? 1500 : opt.resultDelay,
            label: opt.label || '🏁 10問チャレンジ',
            sound: opt.sound || null,
            onToggle: opt.onToggle || null,
            onFinish: opt.onFinish || null,
            record: !!opt.record,
            recordKey: opt.recordKey || 'challenge10',
            css: (opt.css === undefined) ? true : opt.css
        };
        chal.total = cfg.total;
        if (opt.label === undefined && cfg.total !== 10) cfg.label = '🏁 ' + cfg.total + '問チャレンジ';

        // CSS
        if (cfg.css && !$('chal-style')) {
            var st = document.createElement('style');
            st.id = 'chal-style';
            st.textContent = CSS;
            document.head.appendChild(st);
        }
        // ボタンと帯
        var host = (typeof opt.mount === 'string') ? document.querySelector(opt.mount) : opt.mount;
        var wrap = $('chal-wrap');
        if (!wrap) {
            wrap = document.createElement('div');
            wrap.id = 'chal-wrap';
            wrap.innerHTML = BAR_HTML;
            if (host) host.appendChild(wrap);
            else document.body.insertBefore(wrap, document.body.firstChild);
        }
        // 成せき表
        if (!$('chal-result')) {
            var res = document.createElement('div');
            res.id = 'chal-result';
            res.innerHTML = RESULT_HTML;
            document.body.appendChild(res);
        }
        $('btn-challenge').innerText = cfg.label;

        $('btn-challenge').addEventListener('click', function () {
            chal.on = !chal.on;
            if (cfg.sound) cfg.sound();
            chalReset();
            if (cfg.onToggle) cfg.onToggle(chal.on);
            if (cfg.next) cfg.next();
        });
        $('btn-chal-again').addEventListener('click', function () {
            chalReset();
            if (cfg.next) cfg.next();
        });
        $('btn-chal-quit').addEventListener('click', function () {
            chal.on = false;
            chalReset();
            if (cfg.onToggle) cfg.onToggle(false);
            if (cfg.next) cfg.next();
        });

        chalUpdateBar();
        return API;
    }

    var API = {
        init: init,
        done: chalDone,                                        // 1問できた
        miss: function () { if (chal.on) { chal.miss++; chal.missNow++; } },  // まちがえた
        newProblem: function () { chal.missNow = 0; },          // 新しい問題を出した
        reset: chalReset,                                       // 数えなおす
        stop: function () { chal.on = false; chalReset(); },    // やめる
        isOn: function () { return chal.on; },
        updateBar: chalUpdateBar,
        setTotal: function (n) { chal.total = cfg.total = n; chalReset(); },
        state: chal
    };

    global.Challenge10 = API;
    if (typeof module !== 'undefined' && module.exports) module.exports = API;
})(typeof window !== 'undefined' ? window : this);

</script>

<script>
(function(){
  "use strict";
  // すべて「1000分の1（thousandths）」の整数で管理して誤差をなくす
  var level   = 1;
  var baseTh  = 4300;   // レベル1=まんなかの数 / レベル2=左はしの数
  var arrowTh = 4297;
  var hintStage = 0;    // 0=なし。レベル1は1まで、レベル2は2まで
  var nlWide = true;    // 数直線：はばは 0.1 に 固定（9.2〜9.3、まん中に9.25）
  var nlFirstTall = false;  // 「難しい」に 入った ときの 1問目だけ true
  var revealed  = false;

  // 表示モードと「10倍」モードの状態
  var mode = 'nl1';       // 'nl1' | 'nl2' | 'mul'
  var digits = '085';     // もとの数の数字（固定。例 0.85→"085", 1.35→"135"）
  var BASEPOS = 1;        // もとの数は「1けた目の右」に点（d0.d1d2）
  var pointPos = 1;       // いまの小数点の位置＝点の左にある元の数字の数（-1〜3）
  var mulOp = 'x10';      // えらんでいる問題
  var mulRevealed = false;
  var mulRand = false;    // 「ランダム」を選んでいるか
  var mvOffset = 0;       // 2けたの数を中央に寄せるための横ずらし
  var mulIsInteger = false; // いまの問題が整数スタートか（割り算だけ）
  var mulPlaced = true;   // 整数問題で「小数点をつけた」か（整数以外はつねにtrue）
  var mulPointShown = false; // 整数問題で、候補の点をもう置いたか（最初はfalse＝点なし）
  var mulMsg = '';        // 点をつける段階のひとことメッセージ
  var mulHint = false;    // 10倍タブのヒント（くらいの名前・うごかし方）

  // 「小数の見方」モードの状態
  var viewInt=3, viewD1=4, viewD2=5, viewD3=5;   // 3.45 / 3.455
  var viewVp='v1', viewHint=false, viewRevealed=false;
  var viewTarget=2, viewChoice=-1, viewFbMsg='', viewFbCls='';   // 「何の位？」用
  var viewRev=0, viewCnt=340;    // 0=v7「合わせた数」（1・0.1・0.01・0.001のこ数）/ 1=v9「集めた数」（0.01が□こ）
  var subRand=false;           // 小タブの「ランダム」を選んでいるか（表し方・小数のしくみ・小数の見方 共通）
  var viewExpected=[];

  var BASEY = 120, LEFT = 50;
  function rnd(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
  function fmt1(th){ return (th/1000).toFixed(1); }   // 4.3 / 2.4
  function fmt2(th){ return (th/1000).toFixed(2); }   // 4.29 / 2.45
  function fmt3(th){ return (th/1000).toFixed(3); }   // こたえ

  // レベルごとの数直線パラメータ
  function cfg(){
    if(level===1){
      return { axisMin:baseTh-14, drawMin:baseTh-13, drawMax:baseTh+13, PX:33,
               majors:[baseTh-10, baseTh, baseTh+10] };
    }
    if(nlWide){
      var mj=[]; for(var k=0;k<=100;k+=10){ mj.push(baseTh+k); }
      return { axisMin:baseTh-6, drawMin:baseTh-5, drawMax:baseTh+105, PX:8.0, majors:mj };
    }
    return { axisMin:baseTh-4, drawMin:baseTh-3, drawMax:baseTh+53, PX:16.5,
             majors:[baseTh, baseTh+10, baseTh+20, baseTh+30, baseTh+40, baseTh+50] };
  }
  function xOf(th){ var c=cfg(); return LEFT + (th - c.axisMin)*c.PX; }
  function maxHint(){ return level===1 ? 1 : 2; }

  var svg = document.getElementById('nl');

  function txt(th,text,size,fill){
    return '<text x="'+xOf(th)+'" y="78" text-anchor="middle" font-size="'+size+'" font-weight="800" fill="'+fill+'">'+text+'</text>';
  }

  function render(){
    var c = cfg(), s='';

    // 軸
    s += '<line x1="'+xOf(c.axisMin)+'" y1="'+BASEY+'" x2="1018" y2="'+BASEY+'" stroke="var(--line)" stroke-width="3.5" stroke-linecap="round"/>';

    // 目もり（0.005 の真ん中は少し長く）
    for(var th=c.drawMin; th<=c.drawMax; th++){
      var major = c.majors.indexOf(th)!==-1;
      var mid   = (th % 10 === 5);
      var top = major ? BASEY-28 : (mid ? BASEY-21 : BASEY-14);
      var sw  = major ? 3 : (mid ? 1.9 : 1.4);
      s += '<line x1="'+xOf(th)+'" y1="'+top+'" x2="'+xOf(th)+'" y2="'+BASEY+'" stroke="var(--line)" stroke-width="'+sw+'"/>';
    }

    // ラベル
    if(level===1){
      var L0=baseTh-10, L1=baseTh, L2=baseTh+10;
      s += txt(L0, fmt2(L0), 30, 'var(--ink)');
      s += txt(L2, fmt2(L2), 30, 'var(--ink)');
      var ctr = '<text x="'+xOf(L1)+'" y="78" text-anchor="middle" font-size="30" font-weight="800" fill="var(--ink)">'+fmt1(L1);
      ctr += (hintStage>=1) ? '<tspan fill="var(--red)">0</tspan>' : '';
      ctr += '</text>';
      s += ctr;
    } else if(nlWide){
      var wlo=baseTh, wmid=baseTh+50, whi=baseTh+100;
      var wl = '<text x="'+xOf(wlo)+'" y="78" text-anchor="middle" font-size="30" font-weight="800" fill="var(--ink)">'+fmt1(wlo);
      wl += (hintStage>=1) ? '<tspan fill="var(--red)">0</tspan>' : '';   // ヒント①：9.8 → 9.80
      wl += '</text>';
      s += wl;
      s += txt(wmid, fmt2(wmid), 30, 'var(--ink)');
      s += txt(whi, fmt1(whi), 30, 'var(--ink)');
      if(hintStage>=2){                                                   // ヒント②：0.01ごとの数
        [10,20,30,40,60,70,80,90].forEach(function(d){
          s += txt(baseTh+d, fmt2(baseTh+d), 22, 'var(--hintlbl)');
        });
      }
    } else {
      var lo=baseTh, hi=baseTh+50;
      var left = '<text x="'+xOf(lo)+'" y="78" text-anchor="middle" font-size="30" font-weight="800" fill="var(--ink)">'+fmt1(lo);
      left += (hintStage>=2) ? '<tspan fill="var(--red)">0</tspan>' : '';   // ヒント②
      left += '</text>';
      s += left;
      s += txt(hi, fmt2(hi), 30, 'var(--ink)');
      if(hintStage>=1){                                                      // ヒント①：中間の数
        [10,20,30,40].forEach(function(d){
          s += txt(baseTh+d, fmt2(baseTh+d), 26, 'var(--hintlbl)');
        });
      }
    }

    // (m)
    s += '<text x="1026" y="88" text-anchor="end" font-size="26" font-weight="700" fill="#6a7780">(m)</text>';

    // 矢印
    var ax = xOf(arrowTh);
    s += '<line x1="'+ax+'" y1="'+(BASEY+40)+'" x2="'+ax+'" y2="'+(BASEY+10)+'" stroke="var(--arrow)" stroke-width="5" stroke-linecap="round"/>';
    s += '<path d="M '+(ax-11)+' '+(BASEY+18)+' L '+(ax+11)+' '+(BASEY+18)+' L '+ax+' '+(BASEY+4)+' Z" fill="var(--arrow)"/>';
    s += '<text x="'+ax+'" y="'+(BASEY+66)+'" text-anchor="middle" font-size="26" font-weight="900" fill="var(--arrow)">?</text>';

    if(revealed){
      s += '<text x="'+ax+'" y="'+(BASEY-44)+'" text-anchor="middle" font-size="28" font-weight="900" fill="var(--red)">'+fmt3(arrowTh)+'</text>';
    }

    svg.innerHTML = s;
    updateHintBtn();
  }

  function newArrow(){
    var c=cfg(), loTh, hiTh, th, cand=[], tall=[], labeled;
    if(level===1){ loTh=baseTh-12; hiTh=baseTh+12; }
    else if(nlWide){ loTh=baseTh+1; hiTh=baseTh+99; }
    else { loTh=baseTh+1; hiTh=baseTh+49; }
    // 数が 書いてある めもり（そこは こたえが 見えてしまうので 出さない）
    labeled = (level===1) ? [baseTh-10, baseTh, baseTh+10]
            : nlWide     ? [baseTh, baseTh+50, baseTh+100]
                         : [baseTh, baseTh+50];
    for(th=loTh; th<=hiTh; th++){
      if(labeled.indexOf(th)!==-1) continue;
      if(c.majors.indexOf(th)!==-1){ tall.push(th); continue; }   // 0.01 の 高い めもり
      cand.push(th);
    }
    // 3回に 1回くらいは 高い めもり（9.21 や 9.26 など）を 出す
    // 「難しい」に 入った ときの 1問目は かならず 高い めもり（9.31 など）
    if(tall.length && (nlFirstTall || rnd(1,3)===1)) arrowTh = tall[rnd(0,tall.length-1)];
    else arrowTh = cand[rnd(0,cand.length-1)];
    nlFirstTall = false;
    revealed = false;
  }

  function regenerate(){
    baseTh = rnd(1,9)*1000 + ((level===2) ? rnd(0,9) : rnd(1,9))*100;   // 例 4.3 / 2.4 / 7.6
    hintStage = 0;
    newArrow();
  }

  // --- 10倍モード（数字は固定・小数点だけ動く / SVG）---
  function opShift(op){ return op==='x10'?1 : op==='x100'?2 : op==='d10'?-1 : -2; }
  function opLabel(op){ return op==='x10'?'10倍' : op==='x100'?'100倍' : op==='d10'?'1/10' : '1/100'; }
  function opIsMul(op){ return op==='x10' || op==='x100'; }
  function targetPos(op){ return BASEPOS + opShift(op); }   // 正かいの点の位置

  // 数の列レイアウト（固定）：col0,1=左の0 / col2,3,4=元の数字 / col5,6=右の0
  var MV_M = 26, MV_W = 62, MV_VW = 480;
  function colCenter(c){ return MV_M + c*MV_W + MV_W/2 + mvOffset; }
  function dotX(pos){ return MV_M + (pos+2)*MV_W + mvOffset; }   // pos の小数点x

  // pos の数を文字列で（値の判定・表示用）
  function plainAt(pos){
    var LEN = digits.length;
    if(pos>=1){
      if(pos<=LEN){ var ip=digits.slice(0,pos), fp=digits.slice(pos); return ip + (fp?('.'+fp):''); }
      var z=''; for(var j=0;j<pos-LEN;j++) z+='0'; return digits + z;   // 整数＋末尾の0（×10/×100）
    }
    var zeros=-pos, fill=''; for(var i=0;i<zeros;i++) fill+='0'; return '0.'+fill+digits;
  }
  function cleanNum(p){ var v=parseFloat(p); return isNaN(v)?'':String(v); }
  function mulCorrect(){ return parseFloat(plainAt(targetPos(mulOp))); }

  // くらいの名前（e=0 が一の位、e=1 が十の位、e=-1 が1/10の位）
  function placeName(e){
    return ({3:'千の位',2:'百の位',1:'十の位',0:'一の位','-1':'1/10','-2':'1/100','-3':'1/1000'})[e] || '';
  }
  function plabel(c, e){
    var t = placeName(e), cx = colCenter(c), w = 12;
    for(var k=0;k<t.length;k++){ w += (t.charCodeAt(k) < 128) ? 8.2 : 14.2; }
    w = Math.min(MV_W-4, w);
    return '<rect x="'+(cx-w/2)+'" y="-19" width="'+w+'" height="21" rx="5" fill="#e8f0fc" stroke="#bcd0ef"/>' +
           '<text x="'+cx+'" y="-3" text-anchor="middle" font-size="14" font-weight="800" fill="var(--hintlbl)">'+t+'</text>';
  }
  function dtext(cx, ch, fill){
    return '<text x="'+cx+'" y="64" text-anchor="middle" font-size="56" font-weight="800" fill="'+fill+'">'+ch+'</text>';
  }
  function buildMoverSVG(){
    var LEN = digits.length;
    var placing = (mulIsInteger && !mulPlaced);   // 整数問題で、まだ点をつけていない段階
    var s = '<svg viewBox="0 -22 '+MV_VW+' 154" xmlns="http://www.w3.org/2000/svg">';
    // 左の0（割り算で点が左に出るとき）。点をつける段階では出さない
    if(!placing){
      if(pointPos<=0){ s += dtext(colCenter(1),'0','#c2cace'); }
      if(pointPos<=-1){ s += dtext(colCenter(0),'0','#c2cace'); }
    }
    // 元の数字（いつも同じ位置・等間かく）
    for(var k=0;k<LEN;k++){ s += dtext(colCenter(k+2), digits.charAt(k), 'var(--ink)'); }

    if(placing){
      if(mulHint){ for(var q=0;q<LEN;q++){ s += plabel(q+2, LEN-1-q); } }
      // 点をつける段階：点がつけられる場所を「あきスロット」で示す（1..LEN）。
      // まだ選んでいなければ点は出さない。えらんだ場所だけ赤い点。
      for(var sp=1; sp<=LEN; sp++){
        if(mulPointShown && sp===pointPos){
          s += '<circle cx="'+dotX(sp)+'" cy="60" r="6" fill="var(--red)"/>';
        } else {
          s += '<circle cx="'+dotX(sp)+'" cy="60" r="6" fill="none" stroke="#b9c2c7" stroke-width="2" stroke-dasharray="3 3"/>';
        }
      }
      s += '</svg>';
      return s;
    }

    // ヒント：いまの小数点の位置での、くらいの名前（見えている列だけ）
    if(mulHint){
      var cFrom = Math.min(2, pointPos+1), cTo = Math.max(2+LEN-1, pointPos+1);
      for(var cc=cFrom; cc<=cTo; cc++){ s += plabel(cc, pointPos+1-cc); }
    }
    // 右の0（かけ算で点が右に出るとき）
    for(var j=0; j < pointPos-LEN; j++){ s += dtext(colCenter(2+LEN+j),'0','#c2cace'); }
    // もとの小数点（うす灰色）
    s += '<circle cx="'+dotX(BASEPOS)+'" cy="60" r="5" fill="#c2cace"/>';
    // 動いたぶんだけ「10倍」または「1/10」の弧を1つずつ
    var delta = pointPos - BASEPOS;
    if(delta !== 0){
      var stepLabel = (delta>0) ? '10倍' : '1/10';
      var n = Math.abs(delta);
      for(var h=0; h<n; h++){
        var from = (delta>0) ? (BASEPOS+h) : (BASEPOS-h);
        var to   = (delta>0) ? (from+1) : (from-1);
        var x1=dotX(from), x2=dotX(to), mx=(x1+x2)/2;
        s += '<path d="M '+x1+' 74 Q '+mx+' 100 '+x2+' 74" fill="none" stroke="var(--red)" stroke-width="3.5"/>';
        s += '<path d="M '+(x2-6)+' 80 L '+(x2+6)+' 80 L '+x2+' 69 Z" fill="var(--red)"/>';
        s += '<text x="'+mx+'" y="118" text-anchor="middle" font-size="16" font-weight="800" fill="var(--red)">'+stepLabel+'</text>';
      }
    }
    // いまの小数点（赤）
    s += '<circle cx="'+dotX(pointPos)+'" cy="60" r="6" fill="var(--red)"/>';
    s += '</svg>';
    return s;
  }

  function renderMul(){
    var baseStr = plainAt(BASEPOS);                 // "6.74" / "63.8" / "638" / "89"
    document.getElementById('qmul').textContent =
      baseStr+' を '+opLabel(mulOp)+' '+(opIsMul(mulOp)?'した':'にした')+'数は？';
    document.getElementById('mover').innerHTML = buildMoverSVG();
    var dh = document.getElementById('draghint');
    if(dh){
      if(mulIsInteger && !mulPlaced){
        dh.innerHTML = '小数点は どこに つく？　点（<span style="color:var(--red);font-weight:900">.</span>）が つく ところ を タップ（ドラッグ）で えらんでね。';
      } else {
        dh.innerHTML = '小数点（<span style="color:var(--red);font-weight:900">.</span>）を 左右に ドラッグ してね';
      }
    }
    var mh = document.getElementById('mulhint');
    if(!mulHint){ mh.textContent = ''; }
    else if(mulIsInteger && !mulPlaced){
      mh.textContent = 'ヒント：整数の 小数点は、一のくらいの 右に かくれているよ';
    } else {
      var n = Math.abs(opShift(mulOp));
      mh.textContent = 'ヒント：'+opLabel(mulOp)+" は"+' 小数点を '+(opIsMul(mulOp)?'右':'左')+'へ '+n+'つ うごかす';
    }
    var rv = document.getElementById('revealmul');
    if(mulIsInteger && !mulPlaced && !mulRevealed){
      rv.textContent = mulMsg;
    } else {
      rv.textContent = mulRevealed ? ('こたえ：'+cleanNum(plainAt(targetPos(mulOp)))) : '';
    }
  }

  // 数の作りかた（けた数とスタート位置）
  //  ・×10/×100：整数スタートなし。「先頭に0（0.xx/0.xxx）」を多めに
  //  ・1/10/1/100：整数（23・89・638）も小数も。2けたと3けたを半々で
  function newMul(op){
    op = op || mulOp;
    var isDiv = (op==='d10' || op==='d100');
    var len, basepos, r;
    if(isDiv){
      len = (rnd(0,1)===0) ? 2 : 3;                  // 2けた／3けた を半々
      if(len===2){
        basepos = (rnd(0,9)<7) ? 2 : 1;              // 89(整数)70% / 8.9 30%
      } else {
        r = rnd(0,9);
        basepos = (r<5) ? 3 : (r<8 ? 2 : 1);         // 638(整数)50% / 63.8 30% / 6.38 20%
      }
    } else {
      len = (rnd(0,2)===0) ? 2 : 3;                  // 2けた約1/3・3けた約2/3
      r = rnd(0,9);
      if(len===2){
        basepos = (r<7) ? 0 : 1;                     // 0.89 70% / 8.9 30%（整数なし）
      } else {
        basepos = (r<6) ? 0 : (r<9 ? 1 : 2);         // 0.638 60% / 6.38 30% / 63.8 10%（整数なし）
      }
    }
    var ds=''; for(var i=0;i<len;i++){ ds += rnd(1,9); } // 各けた1〜9（先頭0や空位0を避ける）
    digits = ds;
    mvOffset = (len===2) ? (MV_W/2) : 0;             // 2けたは中央に寄せる
    BASEPOS = basepos;
    mulIsInteger = (BASEPOS === len);               // 点が右はし＝整数スタート（割り算だけ）
    if(mulIsInteger){ pointPos = len; mulPlaced = false; mulPointShown = false; mulMsg = ''; }
    else { pointPos = BASEPOS; mulPlaced = true; mulPointShown = false; mulMsg = ''; }
    mulRevealed = false;
    mulHint = false;
  }

  // --- 小数の見方モード ---
  function vStr(){ return viewInt+'.'+viewD1+viewD2; }
  function vStr3(){ return viewInt+'.'+viewD1+viewD2+viewD3; }                 // 1.435 の形
  // 「小数の見方」タブと「表し方」タブは 同じ画面（viewArea）を つかう
  function vOn(){ return mode==='view'; }
  function vIs3(){ return viewVp==='v5' || viewVp==='v6'; }
  // こ数 → 数 を こたえ欄に書くタイプ。
  //   v7「合わせた数」 … 1を8こ、0.1を2こ、… あわせた数は？（viewRev=0）
  //   v9「集めた数」   … 0.01 を 814 こ 集めた数は？（viewRev=1）
  function vIsRev(){ return viewVp==='v7' || viewVp==='v9'; }
  function vRevAns(){ return (viewRev===0) ? (viewInt+viewD1/10+viewD2/100+viewD3/1000) : (viewCnt/100); }
  function vRevStr(){ return String(Math.round(vRevAns()*1000)/1000); }                    // 0.001まで使う見方
  function vPlaceName(i){ return ['一の位','1/10の位','1/100の位','1/1000の位'][i]; }
  function vDigits(){ return [viewInt, viewD1, viewD2, viewD3]; }

  // 位取り表（一のくらい ｜ 1/10 1/100 1/1000）
  function buildViewGrid(empty){
    var x0=50,y0=20,W=80,H=90,yb=y0+H, d=vDigits();
    // 「1・0.1・0.01・0.001」と「数を書く」では、表に入るのは こたえではなく
    // 子どもが書いた数字（v5Typed4／v7Cells）。位の名前も出さない。
    var v5 = (viewVp==='v5'), typed = v5 ? v5Typed4() : (vIsRev() ? v7Cells() : null);
    var s='<svg viewBox="0 0 420 200" xmlns="http://www.w3.org/2000/svg">';
    s += '<rect x="'+x0+'" y="'+y0+'" width="'+(4*W)+'" height="'+H+'" fill="none" stroke="var(--line)" stroke-width="3"/>';
    for(var i=1;i<4;i++){ var xv=x0+i*W;

  // ちがいが決まる位（1=1/10, 2=1/100, 3=1/1000）。それより下をうすくする
  function ineqDecPlace(){
    if(ineqA.d1!==ineqB.d1) return 1;
    if(ineqA.d2!==ineqB.d2) return 2;
    if(ineqA.d3!==ineqB.d3) return 3;

  }
  // 1文字ずつ組み立てる（ヒント＝くらいの名前・うしろの赤い0 / かくす＝決まる位より下をうすく）
  // 1文字ずつ組み立てる。
  //  ・小数第三位は いつも 書いておく（もともと2けたの数に おぎなった0は ふだん 見えない＝ghost）
  //    こうすると ヒント・かくす を押しても 数が 横に ずれない。
  //  ・ヒント …… おぎなった0を 赤で見せる
  //  ・かくす …… ちがいが決まる位より 下を うすくする
  function ineqNumHtml(x){
    function dg(ch, cls){
      return '<span class="dg'+(cls?' '+cls:'')+'">'+ch+'</span>';
    }
    var h='', ns=String(x.N);
    for(var i=0;i<ns.length;i++){ h += dg(ns.charAt(i), ''); }
    h += '.';
    var ds=[x.d1,x.d2,x.d3];
    var dp = ineqHidden ? ineqDecPlace() : 9;
    var vis='', fai='';
    for(var k=0;k<3;k++){
      var added = (k===2 && x.len!==3);                 // うしろにつけた0
      var cls = '';
      if(added){
        if(ineqHint) cls='zero';                        // ヒント＝赤で見せる
        else if(!ineqHidden) cls='ghost';               // ふだんは 場所だけ取って かくす
      }
      var cell = dg(String(ds[k]), cls);
      if(k<dp) vis += cell; else fai += cell;
    }
    h += vis + (fai ? '<span class="faint">'+fai+'</span>' : '');
    return '<span class="num">'+h+'</span>';
  }

  };
  var hisA={v:1540,d:2}, hisB={v:4630,d:2};
  function hNum(x){ return (x.v/1000).toFixed(x.d); }        // "1.54" / "3.4" / "4"
  function hAnsV(){ return (hisOp==='add') ? (hisA.v+hisB.v) : (hisA.v-hisB.v); }
  function hMaxDec(){ return Math.max(hisA.d, hisB.d); }
  function hCanon(){ return String(hAnsV()/1000); }           // 末尾の0なし（0.9）
  function hAnsStr(){ return (hAnsV()/1000).toFixed(hMaxDec()); } // 筆算に書く形（0.900）
  function hIntLen(s){ var i=s.indexOf('.'); return (i<0)? s.length : i; }
  function hDigAt(s, e){                                      // 文字列 s の e の位の数字
    var dot=s.indexOf('.'), ip=(dot<0)?s:s.slice(0,dot), fp=(dot<0)?'':s.slice(dot+1);
    if(e>=0){ var i=ip.length-1-e; return (i>=0)? ip.charAt(i) : ''; }
    var k=-e-1; return (k<fp.length)? fp.charAt(k) : '';
  }

  function newHis(){
    if(hisRand) hisOp = (rnd(0,1)===0) ? 'add' : 'sub';
    if(hisFmt==='word'){ genWord(); }
    else if(hisFmt==='base'){ genBase(); }
    else if(hisFmt==='yoko'){ genYoko(); }
    else if(hisFmt==='pick'){ genYoko(); pickOrder=rnd(0,1); pickChose=-1; }
    else if(hisFmt==='miss'){ genMiss(); }
    else { genPlain(); }
    hisHint=false; baseHintOn=false; hisRevealed=false; hisSolved=false; hZBusy=false;
  }

  // 文しょうだい（テスト①②の形）
  function genWord(){
    var list=HIS_WORD[hisOp], t=list[rnd(0,list.length-1)], a, b;
    if(hisOp==='add'){
      a={v:rnd(1,9)*1000+rnd(0,9)*100+rnd(1,9)*10, d:2};
      b=(rnd(0,1)===0) ? {v:rnd(0,9)*100+rnd(1,9)*10, d:2}                    // 0.18 のような小さい数
                       : {v:rnd(1,4)*1000+rnd(1,9)*100, d:1};     // 2.5 のような1けた小数
    } else {
      a={v:rnd(4,9)*1000+rnd(0,9)*100+rnd(1,9)*10, d:2};
      b=(rnd(0,1)===0) ? {v:rnd(1,3)*1000+rnd(0,9)*100+rnd(1,9)*10, d:2}
                       : {v:rnd(1,3)*1000+rnd(1,9)*100, d:1};     // 7.23−6.2 の形
    }
    hisA=a; hisB=b; hisUnit=t.u;
    hisStory = t.t.replace('{A}', hNum(a)).replace('{B}', hNum(b));
  }

  // 0.01をもとにして考える（テスト④の形）。どちらも小数第二位まで。
  // 「次に」の答え（0.01 が 何こ）は いつも 3けた（101〜999）に おさめる。
  function genBase(){
    var ac, bc, S, D;
    if(hisOp==='add'){
      if(rnd(0,1)===0){                       // 和が 470 のように 0 で おわる
        S=rnd(21,99)*10;                      // 210〜990（3けた）
        do{ ac=rnd(101, S-101); }while(ac%10===0);
        bc=S-ac;
      } else {                                // 和が 3けたに おさまるように
        do{ ac=rnd(101, 800); }while(ac%10===0);
        do{ bc=rnd(101, 999-ac); }while(bc%10===0);
      }
    } else {
      do{ ac=rnd(400,999); }while(ac%10===0);
      if(rnd(0,1)===0){                       // 差が 280 のように 0 で おわる
        D=rnd(11, Math.floor((ac-101)/10))*10; bc=ac-D;
      } else { do{ bc=rnd(101, ac-101); }while(bc%10===0); }
    }
    hisA={v:ac*10,d:2}; hisB={v:bc*10,d:2};
  }

  // 「まず・次に・だから」を たてにそろえて、いま どの だんかいか が わかるようにする。
  //   0.01を もとにして 考えます。
  //   まず、  2.37 は、0.01 が 237 こ
  //           2.23 は、0.01 が □   こ
  //   次に、  237 ＋ 223 ＝ 460
  //   だから、0.01 が □ こで、
  //           2.37 ＋ 2.23 ＝ □
  // 左の列（まず・次に・だから）と 右の列（中身）の 2列の grid。
  // 2行目・6行目は 左の列を からにするので、上の行と 頭が たてにそろう。
  // 「0.01をもとに」のヒント。左の説明文は いつも 同じ形のまま で、
  // ヒントは 右がわの パネルに 出す（「次に」の答えの 赤わく と やじるし だけは 上にかさねる）。
  // 出すヒントは「いま 書こうとしている □」で きまる（＝ まだ 書いていない いちばん上の □）。
  //   □① … 0.01 が 何こ（「小数の見方／0.01が□こ」と同じ形）
  //   □② … 「次に」の答えを 赤わくで囲み、□へ 赤いやじるし
  //   □③ … 0.01 の けたに こ数を そろえる（「集めた数」と同じ形）
  var baseHintOn = false;
  var hbNums = {};
  var hbCur = 0;           // いま 書いている □（0〜2）。ヒントは これで きまる。

  // こ数を 0.01 の けたに そろえた 2段の HTML。
  //     0 . 0 1  が        （3けたより多いときは 左に 列が ふえる）
  //   1 2   7 4  こで、    （そのまま読むと 12.74）
  function hbAlign(cnt, tailTop, tailBot){
    var s=String(cnt), n=Math.max(0, s.length-3), i;   // n＝0.01の一の位より 左に ふえる列の数
    var dig=[];
    for(i=0;i<n+3-s.length;i++) dig.push('');          // 右づめ（3けたより少ないとき）
    for(i=0;i<s.length;i++) dig.push(s.charAt(i));
    var cols='';                                       // けた(n+1) ＋ 小数点 ＋ けた2 ＋ ことば
    for(i=0;i<n+1;i++) cols+='auto ';
    cols+='auto auto auto auto';
    var h='<span class="hbg" style="grid-template-columns:'+cols+'">';
    for(i=0;i<n;i++)  h+='<span class="c"></span>';    // 上の段（0.01）
    h+='<span class="c">0</span><span class="d">.</span><span class="c">0</span><span class="c">1</span>'+
       '<span class="t">'+tailTop+'</span>';
    for(i=0;i<=n;i++) h+='<span class="c">'+dig[i]+'</span>';   // 下の段（こ数）
    h+='<span class="d"></span><span class="c">'+dig[n+1]+'</span><span class="c">'+dig[n+2]+'</span>'+
       '<span class="t">'+tailBot+'</span>';
    return h+'</span>';
  }

  function hisBaseHtml(){
    var A=hNum(hisA), B=hNum(hisB), sg=(hisOp==='add') ? '＋' : '－';
    var ac=Math.round(hisA.v/10), bc=Math.round(hisB.v/10);
    var rc=(hisOp==='add') ? (ac+bc) : (ac-bc);
    hisExpected=[bc, rc, rc/100];
    hbNums={A:A, B:B, sg:sg, ac:ac, bc:bc, rc:rc};
    function row(label, body){ return '<div class="hb-l">'+label+'</div><div class="hb-c">'+body+'</div>'; }
    return '<div class="hbwrap">'+
             '<div class="hb" id="hbgrid">'+
               '<div class="hb-full">0.01を もとにして 考えます。</div>'+
               row('まず、',  A+' は、0.01 が '+ac+' こ')+
               row('',        B+' は、0.01 が '+blankInput(0)+' こ')+
               row('次に、',  ac+' '+sg+' '+bc+' ＝ <span class="hbsum" id="hbsum">'+rc+'</span>')+
               row('だから、','0.01 が '+blankInput(1)+' こで、')+
               row('',        A+' '+sg+' '+B+' ＝ '+blankInput(2))+
               '<svg class="hbarrow" id="hbarrow"></svg>'+
             '</div>'+
             '<div class="hbside" id="hbside"></div>'+
           '</div>';
  }

  function hbBlankAt(i){ return document.querySelector('#hisbase .vbl[data-i="'+i+'"]'); }
  function hbOn(){ return mode==='his' && hisFmt==='base'; }
  // いま 書いている □。ヒントは 青いわくの □ に 合わせる。
  // （数字を 1つ 打っただけでは 変わらない。つぎの □ に うつったときだけ 変わる）
  function hbCurrent(){ return Math.min(2, Math.max(0, hbCur)); }
  // いまの □ を うつす（青いわく＋テンキーのいき先＋ヒントの切りかえ）
  function hbSetCur(i, focus){
    hbCur = Math.min(2, Math.max(0, i));
    Array.prototype.forEach.call(document.querySelectorAll('#hisbase .vbl'), function(b){
      b.classList.toggle('cur', +b.getAttribute('data-i') === hbCur);
    });
    var cur = hbBlankAt(hbCur);
    if(cur){ keyTarget = cur; if(focus) cur.focus(); }   // タブレットで キーボードが 出ないよう、打っているときだけ focus
    renderBaseHint();
  }
  // その □ に 入る数の けた数（'117'→3・'6.61'→4）
  function hbExpLen(i){ var e=hisExpected[i]; return (e===undefined) ? 3 : String(e).length; }
  // 入れおわったら つぎの □ へ（ここで はじめて ヒントが 変わる）
  function hbAdvance(el){
    var i = +el.getAttribute('data-i');
    if(i<2 && el.value.trim().length >= hbExpLen(i)) hbSetCur(i+1, document.activeElement===el);
    else renderBaseHint();
  }
  function renderBaseHint(){
    var side=document.getElementById('hbside'), sum=document.getElementById('hbsum');
    if(!side) return;
    var i = baseHintOn ? hbCurrent() : -1, n=hbNums, h='';
    if(sum) sum.classList.toggle('on', i===1);
    if(i<0){ side.innerHTML=''; hbDrawArrow(); return; }
    if(i===0){
      h = '<div class="ht">0.01 が 何こ？</div>'+
          '<div class="hl">'+n.A+' は、</div>'+
          '<div class="hl">0.01 が '+n.ac+' こ</div>'+
          '<div class="hl">'+n.B+' は、</div>'+
          '<div class="hl">0.01 が □ こ</div>';
    } else if(i===1){
      h = '<div class="ht">「次に」の 答えを<br>そのまま 書くよ</div>';
    } else {
      h = '<div class="ht">0.01 の けたに<br>そろえて 読むよ</div>'+
          '<div class="hl">'+hbAlign(n.rc,'が','こで、')+'</div>';
    }
    side.innerHTML = '<div class="hbcard"><div class="hbin">'+h+'</div></div>';
    hbDrawArrow();
  }
  function hbAfter(){ if(mode==='his' && hisFmt==='base') renderBaseHint(); }

  // □② のヒント：「次に」の答え → 2つ目の□ へ 赤いやじるし
  function hbDrawArrow(){
    var svg=document.getElementById('hbarrow');
    if(!svg) return;
    var grid=document.getElementById('hbgrid');
    var from=document.getElementById('hbsum');
    var to=hbBlankAt(1);
    if(!baseHintOn || hbCurrent()!==1 || !grid || !from || !to){ svg.innerHTML=''; return; }
    var g=grid.getBoundingClientRect(), a=from.getBoundingClientRect(), b=to.getBoundingClientRect();
    if(g.width<4) return;
    svg.setAttribute('viewBox','0 0 '+g.width+' '+g.height);
    svg.setAttribute('width', g.width); svg.setAttribute('height', g.height);
    var x1=a.left-g.left+a.width/2, y1=a.bottom-g.top+4;          // 「次に」の答えの 下
    var xe=b.right-g.left+9,        ye=(b.top+b.bottom)/2-g.top;  // □ の 右がわ
    var d='M'+x1+' '+y1+' C '+x1+' '+(y1+16)+', '+(xe+Math.max(24,(x1-xe)*0.5))+' '+ye+', '+xe+' '+ye;
    svg.innerHTML =
      '<path d="'+d+'" fill="none" stroke="var(--red)" stroke-width="3" stroke-linecap="round"/>'+
      '<path d="M'+(xe-3)+' '+ye+' l 10 -6 l 0 12 z" fill="var(--red)"/>';
  }
  // 「0.01をもとに」の 上の 説明（何の計算の しかたを 説明するのか）
  function hisBaseHead(){
    return hNum(hisA)+' '+((hisOp==='add') ? '＋' : '－')+' '+hNum(hisB)+' の 計算の しかたを 説明します。<br>'+
           '□に あてはまる数を 書きましょう。';
  }

  function genPlain(){
    var a,b,r,S,av,bv,t;
    if(hisOp==='add'){
      r=rnd(0,3);
      if(r===0){                        // 1.54＋4.63（小数第二位まで）
        a={v:rnd(1,8)*1000+rnd(0,9)*100+rnd(1,9)*10,d:2}; b={v:rnd(1,8)*1000+rnd(0,9)*100+rnd(1,9)*10,d:2};
      } else if(r===1){                 // 0.619＋0.281＝0.900（和の小数第二位・第三位が0）
        S=rnd(5,19)*100;
        do{ av=rnd(101,S-101); }while(av%10===0);
        a={v:av,d:3}; b={v:S-av,d:3};
      } else if(r===2){                 // 5.68＋3.4（けた数がそろわない）
        a={v:rnd(1,8)*1000+rnd(0,9)*100+rnd(1,9)*10,d:2}; b={v:rnd(1,8)*1000+rnd(1,9)*100,d:1};
        if(rnd(0,1)===0){ t=a; a=b; b=t; }
      } else {                          // 2.345＋1.28
        a={v:rnd(1,8)*1000+rnd(0,99)*10+rnd(1,9),d:3}; b={v:rnd(1,8)*1000+rnd(0,9)*100+rnd(1,9)*10,d:2};
      }
    } else {
      r=rnd(0,3);
      if(r===0){                        // 9.75−3.96（くり下がり）
        a={v:rnd(4,9)*1000+rnd(0,9)*100+rnd(1,9)*10,d:2}; b={v:rnd(1,3)*1000+rnd(0,9)*100+rnd(1,9)*10,d:2};
      } else if(r===1){                 // 10.4−9.82（けた数がそろわない）
        a={v:rnd(10,19)*1000+rnd(1,9)*100,d:1}; b={v:rnd(5,9)*1000+rnd(0,9)*100+rnd(1,9)*10,d:2};
      } else if(r===2){                 // 4−0.095（ひかれる数が整数）
        do{ bv=rnd(11,999); }while(bv%10===0);
        a={v:rnd(2,9)*1000,d:0}; b={v:bv,d:3};
      } else {                          // 7.26−3.5
        a={v:rnd(4,9)*1000+rnd(0,9)*100+rnd(1,9)*10,d:2}; b={v:rnd(1,3)*1000+rnd(1,9)*100,d:1};
      }
    }
    hisA=a; hisB=b;
  }

  /* ===== 「横式」＝ 横の式を 筆算の形に 書きなおす（計算は しない） =====
     ねらい：小数点（＝位）を たてに そろえる。右はしを そろえるのは まちがい。
       5.36 ＋ 4.5  →    5.36
                       ＋ 4.5
     わざと 小数のけた数（や 整数のけた数）が ちがう数を 出す。            */
  function genYoko(){
    var a,b,t,r,bv;
    // ひき算のときは ときどき「整数 － 小数」（4 － 0.095）を 出す
    if(hisOp==='sub' && rnd(0,2)===0){
      do{ bv=rnd(11,999); }while(bv%10===0);
      hisA={v:rnd(2,9)*1000,d:0};
      hisB={v:bv,d:3};
      return;
    }
    r=rnd(0,2);
    if(r===0){                          // 5.36 と 4.5（小数第二位 と 小数第一位）
      a={v:rnd(1,9)*1000+rnd(0,9)*100+rnd(1,9)*10,d:2};
      b={v:rnd(1,9)*1000+rnd(1,9)*100,d:1};
    } else if(r===1){                   // 7.46 と 0.6（1より小さい数）
      a={v:rnd(2,9)*1000+rnd(0,9)*100+rnd(1,9)*10,d:2};
      b={v:rnd(1,9)*100,d:1};
    } else {                            // 2.345 と 1.28（小数第三位 と 第二位）
      a={v:rnd(1,9)*1000+rnd(0,99)*10+rnd(1,9),d:3};
      b={v:rnd(1,9)*1000+rnd(0,9)*100+rnd(1,9)*10,d:2};
    }
    if(hisOp==='add'){ if(rnd(0,1)===0){ t=a; a=b; b=t; } }  // 上下を 入れかえることもある
    else if(a.v <= b.v){ t=a; a=b; b=t; }                    // ひき算は 大きい数を 上に
    hisA=a; hisB=b;
  }

  function yokoOn(){ return mode==='his' && hisFmt==='yoko'; }

  /* ===== 「横式→筆算（選ぶ）」＝ 2つの筆算から 正しいほうを えらぶ =====
     問題の数は 横式と同じ（genYoko）。
       正しい … 小数点（＝位）を たてに そろえた 形
       まちがい … 右はしを そろえた 形                                   */
  var pickOrder = 0;      // 0＝正しいほうが 左 / 1＝右
  var pickChose = -1;     // えらんだ番号（-1＝まだ）
  function pickOn(){ return mode==='his' && hisFmt==='pick'; }
  // 筆算1つ分の HTML。right=true なら 右づめ（＝まちがいのほう）
  //   数字は 1つずつ マス（はば --pw）に入り、小数点は マスとマスの あいだ（はば --pdw）。
  //   正しいほう  … 小数点の 場所を そろえる（位が そろう）
  //   まちがいのほう … 右はしを そろえる（それぞれの数を 右づめで 書く）
  // 小数点の ところには 目印（.pdot）を つけておく。ヒントの 赤線は そこを むすぶ。
  // 整数（4 など）は 小数点が 見えないので、
  //   正しいほう … 小数点が くる 場所（あきマス）に 目印
  //   まちがいのほう … 数の 右はし（はば0の 目印）に つける
  function pickGrid(right){
    var W=1.05, D=0.42;                                   // --pw / --pdw と 同じ（em）
    var sg=(hisOp==='add') ? '+' : '−';
    function parts(s){ var i=s.indexOf('.');
      return { ip:(i<0)?s:s.slice(0,i), fp:(i<0)?'':s.slice(i+1), dot:(i>=0) }; }
    var A=parts(hNum(hisA)), B=parts(hNum(hisB));
    function digs(s){ var h='', i;
      for(i=0;i<s.length;i++) h += '<span class="pc">'+s.charAt(i)+'</span>';
      return h; }
    function gap(w){ return (w>0.001) ? '<span class="pgap" style="width:'+w.toFixed(3)+'em"></span>' : ''; }
    function dotCell(show){                               // 小数点のマス（目印つき）
      return '<span class="pdt pdot'+(show?' pd':'')+'">'+(show?'.':'')+'<i class="pba"></i></span>'; }
    var bodyW, html='', rows=[[ '', A],[sg, B]];
    if(right){
      var nat=function(p){ return (p.ip.length+p.fp.length)*W + (p.dot?D:0); };
      bodyW = Math.max(nat(A), nat(B));
      rows.forEach(function(r){
        var p=r[1];
        var in_ = gap(bodyW-nat(p)) + digs(p.ip)
                + (p.dot ? dotCell(true) : '') + digs(p.fp)
                + (p.dot ? '' : '<span class="pend pdot"><i class="pba"></i></span>');
        html += '<span class="prow"><span class="ps">'+r[0]+'</span>'+
                '<span class="pbody" style="width:'+bodyW.toFixed(3)+'em">'+in_+'</span></span>';
      });
    } else {
      var ints=Math.max(A.ip.length, B.ip.length), dec=Math.max(A.fp.length, B.fp.length);
      bodyW = ints*W + D + dec*W;
      rows.forEach(function(r){
        var p=r[1];
        var in_ = gap((ints-p.ip.length)*W) + digs(p.ip) + dotCell(p.dot)
                + digs(p.fp) + gap((dec-p.fp.length)*W);
        html += '<span class="prow"><span class="ps">'+r[0]+'</span>'+
                '<span class="pbody" style="width:'+bodyW.toFixed(3)+'em">'+in_+'</span></span>';
      });
    }
    return '<span class="pgrid">'+html+
           '<span class="pline"></span><span class="pans"></span>'+
           '<svg class="pdline"></svg></span>';
  }
  function buildPickHtml(){
    var a = '<button type="button" class="pickbox" data-i="0" data-ok="'+(pickOrder===0?1:0)+'">'+pickGrid(pickOrder!==0)+'</button>';
    var b = '<button type="button" class="pickbox" data-i="1" data-ok="'+(pickOrder===1?1:0)+'">'+pickGrid(pickOrder!==1)+'</button>';
    return a + b;
  }
  // ヒント：それぞれの筆算で、上の数と 下の数の 小数点を 赤い線で むすぶ。
  //   正しいほう  → たての線（小数点が そろっている）
  //   まちがいのほう → ななめの線（そろっていない）
  function pickDrawLines(){
    if(!pickOn()) return;
    Array.prototype.forEach.call(document.querySelectorAll('#pickwrap .pgrid'), function(g){
      var svg=g.querySelector('.pdline');
      if(!svg) return;
      if(!hisHint){ svg.innerHTML=''; return; }
      var gb=g.getBoundingClientRect();
      if(gb.width<4) return;
      var ms=g.querySelectorAll('.pdot');
      if(ms.length<2){ svg.innerHTML=''; return; }
      var p=[], fs=parseFloat(getComputedStyle(g).fontSize)||20;
      Array.prototype.forEach.call(ms, function(m){
        var r=m.getBoundingClientRect(), a=m.querySelector('.pba');
        var x=r.left-gb.left+r.width/2;                 // 小数点の 場所（はば0の 目印は その点）
        // 小数点は 文字の 足もと（ベースライン）に ある。.pba は その高さの 目印。
        var y = a ? (a.getBoundingClientRect().top - gb.top - fs*0.06)
                  : ((r.top+r.bottom)/2 - gb.top);

  /* ===== 「筆算」タブ ＝ 横線の下の マスに こたえを 書く =====
     紙の筆算と 同じ順番で 書けるように：
       ・小数点は はじめから 印刷してある（打たなくていい）
       ・いちばん 右の マスから 始まり、1つ 打つと 左へ うつる
       ・「←」は 右へ もどる
       ・上に くり上がり・くり下がりの 小さな メモ欄（採点しない）

  function tateOn(){ return mode==='his' && hisFmt==='tate'; }
  // マスの列（左から右へ）の「位」。こたえの けた数も 入れて きめる
  function hPlaces(){
    var aS=hNum(hisA), bS=hNum(hisB), rS=hAnsStr();
    var ints=Math.max(hIntLen(aS), hIntLen(bS), hIntLen(rS)), dec=hMaxDec(), es=[], e;
    for(e=ints-1;e>=0;e--) es.push(e);

  }
  function buildTateGrid(){
    var p=hPlaces(), sg=(hisOp==='add') ? '+' : '−', i;
    var m=(p.rS.indexOf('.')>=0) ? p.rS.match(/0+$/) : null;
    var trail = m ? m[0].length : 0;                 // 書かなくてよい 末尾の0の数
    // どの列で くり上がりが 出るか（その列の たし算が 2けたに なるか）を 先に しらべる
    var car={}, cr=0, ce, cs;
    if(hisOp==='add'){
      for(i=p.es.length-1;i>=0;i--){
        ce=p.es[i];
        cs = (+(hDigAt(p.aS,ce)||0)) + (+(hDigAt(p.bS,ce)||0)) + cr;
        cr = (cs>=10) ? 1 : 0;
        car[i]=cr;                                   // 1＝この列から 左へ くり上がる
      }
    }
    // 計算に つかう いちばん 左の 列（lead）。＋／− は その 1つ 左に 書く
    var lead=0;
    for(i=0;i<p.es.length;i++){
      if(hDigAt(p.aS,p.es[i])!=='' || hDigAt(p.bS,p.es[i])!==''){ lead=i; break; }
    }
    var tpl='auto';
    for(i=0;i<p.ints;i++) tpl+=' var(--yw)';
    tpl+=' var(--ydot)';
    for(i=0;i<p.dec;i++) tpl+=' var(--yw)';

    var h='<div class="ygrid" id="hgrid" style="grid-template-columns:'+tpl+'">';
    // ① くり上がり・くり下がりの メモ
    h+='<div class="ysign"></div>';
    p.es.forEach(function(e,k){
      if(k===p.ints) h+='<div class="ydot mdot"></div>';
      h+='<input class="vbl mcell" data-c="'+k+'" inputmode="numeric" maxlength="2" autocomplete="off">';
    });
    // ②③ 上の数・下の数（＋／− は 下の数の すぐ 左の マスに 書く）
    [[0,p.aS,hisA],[1,p.bS,hisB]].forEach(function(row){
      var r=row[0], s=row[1], x=row[2], isB=(r===1);
      h+='<div class="ysign">'+((isB && lead===0) ? sg : '')+'</div>';
      p.es.forEach(function(e,k){
        if(k===p.ints){
          var dc = (x.d>0) ? '<div class="ydot">.</div>'
                 : (hisHint ? '<div class="ydot faint">.</div>' : '<div class="ydot"></div>');
          h+=dc;
        }
        if(isB && k===lead-1){ h+='<div class="ydig sgc">'+sg+'</div>'; return; }
        var ch=hDigAt(s,e), cls='ydig';
        if(ch==='' && hisHint && e<0){ ch='0'; cls+=' faint'; }   // ヒント＝見えない0
        if(r===0){                                                // 上の数は くり下がりの 書きこみ場所つき
          h+='<div class="'+cls+' dwrap" data-c="'+k+'">'+
             '<span class="dsub"></span><span class="dtop"></span>'+ch+'</div>';

        }

    });

    h+='<div class="yline"></div>';
    // ⑤ こたえの マス
    h+='<div class="ysign"></div>';
    p.es.forEach(function(e,k){
      if(k===p.ints) h+='<div class="ydot adot">.</div>';
      var want=hDigAt(p.rS,e);
      var opt=(e<0 && (-e) > (p.dec-trail)) ? '1' : '0';          // うしろの0は 書かなくてよい
      h+='<div class="hwrap">'+
         '<input class="vbl ycell hcell" data-c="'+k+'" data-e="'+e+'" data-want="'+want+'" data-opt="'+opt+'"'+
         ' data-carry="'+((car[k] && k>lead) ? '1' : '0')+'"'+
         ' data-last="'+((car[k] && k===lead) ? '1' : '0')+'"'+
         ' inputmode="numeric" maxlength="2" autocomplete="off">'+

         '<span class="zx"></span>'+

    });
    h+='<svg class="dlines" id="hlines" preserveAspectRatio="none"></svg>';   // くり下がりの 斜線

  }
  function hCells(){ return document.querySelectorAll('#hgrid .hcell'); }
  function hMemos(){ return document.querySelectorAll('#hgrid .mcell'); }
  // いま書くマス（青わく）。focus=true のときだけ ほんとうに フォーカスする
  function hSetCur(el, focus){

      c.classList.toggle('cur', c===el);

  }
  function hStep(el, d){                             // となりのこたえマスへ（-1＝左 / +1＝右）
