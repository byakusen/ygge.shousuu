  function hMemoAt(c){ return document.querySelector('#hgrid .mcell[data-c="'+c+'"]'); }
  // くり上がりの 1 を 書く ところ（左どなりの こたえのマスの 右上）
  function hCarAt(c){ return document.querySelector('#hgrid .ccell[data-c="'+c+'"]'); }
  // そのマスが 使う「くり上がりの 1」の ばしょ（くり上がりの ない列は null）
  function hCarOf(el){
    if(!el || el.getAttribute('data-carry')!=='1') return null;

  // いちばん さいごの 計算（5+6=11 など）で、十のくらいを 書く こたえのマス
  function hTopOf(el){

  /* ===== ひき算の ヒント（くり下がり）=====================================
     いま 答える くらい まで、紙の上で やるのと 同じ しるしを 上の数に つける。
       ・借りた 列 … その数字に 斜線、上に 新しい数字（7→6、5→4、4→3 など）
       ・0 が つづく ところ … まとめて 斜線、上は 9 9（400→399と1）
       ・その くらい … 数字の 左に 小さい 1（0→10、6→16）
     ================================================================== */
  function hSubMarks(upto){
    var p=hPlaces(), n=p.es.length, A=[], B=[], k, e, da, db;
    for(k=0;k<n;k++){
      e=p.es[k];
      da=hDigAt(p.aS,e); db=hDigAt(p.bS,e);
      A[k] = (da!=='') ? +da : ((e<0) ? 0 : null);      // 小数の あとは 見えない0
      B[k] = (db!=='') ? +db : 0;
    }
    var cur=A.slice(), mod={}, plus={}, chains=[], j, m, t;
    for(j=n-1;j>=upto;j--){
      if(cur[j]===null) continue;
      if(cur[j] - B[j] >= 0) continue;                  // そのまま ひける
      m=j-1;
      while(m>=0 && cur[m]===0) m--;                    // 0 の あいだは 9 に なる
      if(m<0 || cur[m]===null) continue;                // 借りられない（ふつうは ない）
      cur[m]-=1; mod[m]=String(cur[m]);
      for(t=m+1;t<j;t++){ cur[t]=9; mod[t]='9'; }
      cur[j]+=10; plus[j]=true;
      chains.push([m, j-1]);                            // 斜線を 引く 列（m 〜 j-1）
    }
    return {mod:mod, plus:plus, chains:chains};
  }
  function hClearLines(){
    var svg=document.getElementById('hlines');
    if(svg){ while(svg.firstChild) svg.removeChild(svg.firstChild); }
    return svg;
  }
  // 斜線を SVG で 引く（となりあう 列は 1本の 長い線に なる）
  function hDrawSubLines(chains){
    var svg=hClearLines(), g=document.getElementById('hgrid');
    if(!svg || !g) return;
    var gr=g.getBoundingClientRect();
    if(gr.width<=0) return;
    svg.setAttribute('viewBox','0 0 '+gr.width+' '+gr.height);
    (chains||[]).forEach(function(ch){
      var e1=document.querySelector('#hgrid .dwrap[data-c="'+ch[0]+'"]'),
          e2=document.querySelector('#hgrid .dwrap[data-c="'+ch[1]+'"]');
      if(!e1||!e2) return;
      var r1=e1.getBoundingClientRect(), r2=e2.getBoundingClientRect();
      var ln=document.createElementNS('http://www.w3.org/2000/svg','line');
      ln.setAttribute('x1', r1.left-gr.left+1);   ln.setAttribute('y1', r1.top-gr.top+2);
      ln.setAttribute('x2', r2.right-gr.left-1);  ln.setAttribute('y2', r2.bottom-gr.top-2);
      svg.appendChild(ln);
    });
  }
  function renderSubHint(){
    var g=document.getElementById('hgrid'); if(!g) return;
    Array.prototype.forEach.call(g.querySelectorAll('.dtop,.dsub'), function(s){ s.textContent=''; });
    hClearLines();
    if(!(tateOn() && hisOp==='sub' && hisHint)) return;
    var cur=g.querySelector('.hcell.cur');
    if(!cur){                                           // 青わくが ないときは 右の あいている マス
      var list=hCells();
      for(var i=list.length-1;i>=0;i--){ if(list[i].value===''){ cur=list[i]; break; } }
    }
    if(!cur) return;
    var st=hSubMarks(+cur.getAttribute('data-c'));
    Array.prototype.forEach.call(g.querySelectorAll('.dwrap'), function(d){
      var c=+d.getAttribute('data-c'),
          top=d.querySelector('.dtop'), sub=d.querySelector('.dsub');

      else if(st.plus[c]){ sub.textContent = '1'; }

    hDrawSubLines(st.chains);
  }
  // こたえのマスに 数字を 入れる（紙の上の 筆算と 同じ すすみ方）。
  //   くり上がりの ある列（6+7=13 など）… 1つ目の「1」は そのまま くり上がりの ばしょへ、
  //                                     2つ目の「3」を マスに 入れて 左の くらいへ すすむ。
  //   いちばん さいごの 列（5+6=11）… 「1」「1」と 左の マスから 順に 入れる。
  //   くり上がりの ない列（5+3=8 など）… 打った数を マスに 入れて すぐ 左の くらいへ すすむ。
  function hPut(el, k){
    el.classList.remove('ng');
    var car = hCarOf(el);
    if(car && car.value==='' && k==='1'){ car.value = k; return; }   // 十のくらい＝くり上がりの 1
    var top = hTopOf(el);
    if(top && el.value==='' && top.value==='' && k==='1'){           // さいごの 11 の 左の 1
      top.value = k; top.classList.remove('ng'); return;
    }
    el.value = k;
    hLeft(el);                                            // この くらいは おわり → 左へ
  }
  function hClearCells(){
    Array.prototype.forEach.call(document.querySelectorAll('#hgrid .vbl'), function(c){

  // うしろの0に 引いた 斜線を ぜんぶ 消す
  function hZClear(){

      z.classList.remove('on');

  }
  function hBind(){
    Array.prototype.forEach.call(document.querySelectorAll('#hgrid .vbl'), function(c){
      if(c.classList.contains('ccell')) return;       // くり上がりの 1（見せるだけ）
      var memo = c.classList.contains('mcell');
      c.addEventListener('focus', function(){ hSetCur(c, false); });
      c.addEventListener('input', function(){
        hideMaru(); hideBatsu();
        c.classList.remove('ng');

        if(memo){ c.value=v.slice(-2); return; }

      });

  }
  // マスに 書いた数を つなげた 文字列（「うしろの0は消せるよ」を出すために つかう）
  function hTypedStr(){
    var s='', dot=false;
    Array.prototype.forEach.call(hCells(), function(c){
      var e=+c.getAttribute('data-e');
      if(e<0 && !dot){ s+='.'; dot=true; }

  function checkHisTate(){
    var cells=hCells();
    if(cells.length===0) return;
    if(hZBusy) return;                               // 斜線を 引いている あいだは 待つ
    var any=false;
    Array.prototype.forEach.call(cells, function(c){ if(c.value.trim()!=='') any=true; });
    if(!any){
      Array.prototype.forEach.call(cells, function(c){ c.classList.remove('ng'); });
      setFb('こたえの マスに 数を 入れてね','neutral'); return;
    }
    var ok=true, stopped=false;                      // 0 を書くのを やめたあとは ぜんぶ 空
    Array.prototype.forEach.call(cells, function(c){
      var want=c.getAttribute('data-want')||'',
          opt =(c.getAttribute('data-opt')==='1'),
          got =c.value.trim(), good;
      if(!opt){ good=(got===want); }
      else if(stopped){ good=(got===''); }
      else if(got===''){ stopped=true; good=true; }
      else { good=(got===want); }
      c.classList.toggle('ng', !good);
      if(!good) ok=false;
    });
    if(ok){
      Array.prototype.forEach.call(cells, function(c){ c.classList.remove('ng'); });
      hisSolved=true;
      // 書いた「うしろの0」には、左から 順に 斜線を 引いてから はなまる
      var zs=[];
      Array.prototype.forEach.call(cells, function(c){
        if(c.getAttribute('data-opt')==='1' && c.value.trim()!=='') zs.push(c);
      });
      if(!zs.length){ okAnswer(hTypedStr()); return; }
      var raw=hTypedStr(), step=260;
      hZBusy=true;
      zs.forEach(function(c,i){
        setTimeout(function(){
          var z=c.parentNode.querySelector('.zx'); if(z) z.classList.add('on');
        }, step*i + 160);
      });
      setTimeout(function(){ hZBusy=false; okAnswer(raw); }, step*zs.length + 300);
    } else {
      setFb('✗ もういちど','ng'); showBatsu();
    }
  }

  /* ===== 「まちがいさがし」＝ 書いてある 筆算の まちがいを 見つけて クリックする =====
     出す まちがいは 4つ。
       add0     … たし算の こたえの うしろの0を 消し忘れた（クリック＝斜線）
       addcalc  … たし算の 計算まちがい（くり上がりの1を たし忘れた）
       subcalc  … ひき算で くり下がりを しないで 下から上を ひいた（3−7を 7−3）
       sub0     … ひき算の こたえの 一の位の 0を 書き忘れた
     たし算は くり上がりの 1を さいしょから 書いておく。
     subcalc の なおし方は 紙と 同じ 手じゅん（斜線→1へる→小さい1→計算）。 */
  var missKind='add0';      // いまの まちがいの しゅるい
  var missShown={};         // 列 → 画面に 書いてある 数字（'' もある）
  var missBad={};           // 列 → まちがい（true）
  var missFixed={};         // 列 → なおしずみ（緑）
  var missStruck={};        // 列 → うしろの0に 斜線を 引いた
  var missBorrow=null;      // くり下がりの 情報 {c:その列, l:左の列, newLeft, rightWant, leftWant}
  var missStage=0;          // くり下がりの 手じゅん（0〜4）
  var missBusy=false;       // 手じゅんを 見せている あいだ
  var missDone=false;       // ぜんぶ なおせた

  function missOn(){ return mode==='his' && hisFmt==='miss'; }
  function missColOf(p, e){ var i; for(i=0;i<p.es.length;i++){ if(p.es[i]===e) return i; } return -1; }
  function missLead(p){
    var i;
    for(i=0;i<p.es.length;i++){ if(hDigAt(p.aS,p.es[i])!=='' || hDigAt(p.bS,p.es[i])!=='') return i; }
    return 0;
  }
  // たし算で どの列から 左へ くり上がるか（car[k]=1）
  function missCarry(p){
    var car={}, cr=0, i, ce, cs;
    for(i=p.es.length-1;i>=0;i--){
      ce=p.es[i];
      cs=(+(hDigAt(p.aS,ce)||0))+(+(hDigAt(p.bS,ce)||0))+cr;
      cr=(cs>=10)?1:0; car[i]=cr;
    }
    return car;
  }

  function genMiss(){
    var i1,i2,t1,t2,h1,h2,ai,bi,at,bt,ah,bh,pos,p,k,err,c,l;
    missShown={}; missBad={}; missFixed={}; missStruck={};
    missBorrow=null; missStage=0; missBusy=false; missDone=false;

    if(hisOp==='add'){
      missKind = (rnd(0,1)===0) ? 'add0' : 'addcalc';
      if(missKind==='add0'){                      // こたえが 「◯.◯0」に なる たし算
        h1=rnd(1,9); h2=10-h1;
        do{ t1=rnd(0,9); t2=rnd(0,9); }while((t1+t2+1)%10===0);
        i1=rnd(1,8); i2=rnd(1,8);
        hisA={v:i1*1000+t1*100+h1*10,d:2};
        hisB={v:i2*1000+t2*100+h2*10,d:2};
      } else {                                    // くり上がりが あって うしろの0は 出ない たし算
        i1=0;
        do{
          hisA={v:rnd(1,8)*1000+rnd(0,9)*100+rnd(1,9)*10,d:2};
          hisB={v:rnd(1,8)*1000+rnd(0,9)*100+rnd(1,9)*10,d:2};
          err = (Math.round((hisA.v+hisB.v)/10)%10===0) ? null : missAddErr(hPlaces());
          i1++;
        }while(!err && i1<80);
        if(!err) err = missAddErr(hPlaces(), true);
      }
    } else {
      missKind = (rnd(0,1)===0) ? 'subcalc' : 'sub0';
      if(missKind==='sub0'){                      // こたえが 1より 小さい（くり下がり なし）
        i1=rnd(1,8);
        t1=rnd(1,9); t2=rnd(0,t1-1);
        h1=rnd(1,9); h2=rnd(0,h1-1);
        hisA={v:i1*1000+t1*100+h1*10,d:2};
        hisB={v:i1*1000+t2*100+h2*10,d:2};
      } else {                                    // くり下がりが 1回だけ ある ひき算
        pos=rnd(0,1);
        ai=rnd(2,9); bi=rnd(0,ai-1);
        if(pos===0){                              // 1/100の位で くり下がり
          do{ ah=rnd(0,8); bh=rnd(ah+1,9); }while(bh===ah+5);
          at=rnd(1,9); bt=rnd(0,at-1);
        } else {                                  // 1/10の位で くり下がり
          do{ at=rnd(0,8); bt=rnd(at+1,9); }while(bt===at+5);
          ah=rnd(1,9); bh=rnd(0,ah-1);
        }
        hisA={v:ai*1000+at*100+ah*10,d:2};
        hisB={v:bi*1000+bt*100+bh*10,d:2};
      }
    }

    // 画面に 書く 数字を きめる（まず ぜんぶ 正しく 書いてから、まちがいを 1つ 入れる）
    p=hPlaces();
    p.es.forEach(function(e,k){ missShown[k]=hDigAt(p.rS,e); });

    if(missKind==='add0'){
      k=missColOf(p,-2);                          // うしろの0（1/100の位）
      missBad[k]=true;
    } else if(missKind==='addcalc'){
      missShown[err.k]=err.wrong; missBad[err.k]=true;
    } else if(missKind==='sub0'){
      k=missColOf(p,0);                           // 一の位
      missShown[k]=''; missBad[k]=true;
    } else {
      c=missColOf(p, (pos===0) ? -2 : -1);        // くり下がりが 必要な 列
      l=c-1;                                      // その 左の 列
      missBorrow={
        c:c, l:l,
        newLeft: (+hDigAt(p.aS,p.es[l])) - 1,     // 斜線を 引いて 1 へった 数
        rightWant: hDigAt(p.rS,p.es[c]),
        leftWant : hDigAt(p.rS,p.es[l])
      };
      // 下から 上を ひいた 数 ／ 借りずに ひいた 数
      missShown[c]=String((+hDigAt(p.bS,p.es[c])) - (+hDigAt(p.aS,p.es[c])));
      missShown[l]=String((+hDigAt(p.aS,p.es[l])) - (+hDigAt(p.bS,p.es[l])));
      missBad[c]=true; missBad[l]=true;
    }
  }
  // たし算の 計算まちがいを 入れる 列を えらぶ（くり上がりの1を たし忘れた 形を 先に）
  function missAddErr(p, loose){
    var carIn={}, cr=0, i, ce, da, db, cs, lead=missLead(p), cand=[], k, want, wrong;
    for(i=p.es.length-1;i>=0;i--){
      ce=p.es[i]; carIn[i]=cr;
      cs=(+(hDigAt(p.aS,ce)||0))+(+(hDigAt(p.bS,ce)||0))+cr;
      cr=(cs>=10)?1:0;
    }
    for(i=p.es.length-1;i>=lead;i--){
      ce=p.es[i];
      da=+(hDigAt(p.aS,ce)||0); db=+(hDigAt(p.bS,ce)||0);
      // 1を たし忘れても 左への くり上がりが 変わらない 列だけ（ほかは そのまま 出す）
      if(carIn[i]===1 && hDigAt(p.rS,ce)!=='' && ((da+db+1>=10)===(da+db>=10))) cand.push(i);
    }
    if(!cand.length){
      if(!loose) return null;                     // くり上がりの ない 問題は 出しなおす
      for(i=p.es.length-1;i>=lead;i--){ if(hDigAt(p.rS,p.es[i])!=='') cand.push(i); }
    }
    k=cand[rnd(0,cand.length-1)];
    want=+hDigAt(p.rS,p.es[k]);
    wrong=(want+9)%10;
    return {k:k, wrong:String(wrong)};
  }

  function buildMissGrid(){
    var p=hPlaces(), sg=(hisOp==='add') ? '+' : '−', i;
    var car=(hisOp==='add') ? missCarry(p) : {};
    var lead=missLead(p);
    var tpl='auto';
    for(i=0;i<p.ints;i++) tpl+=' var(--yw)';
    tpl+=' var(--ydot)';
    for(i=0;i<p.dec;i++) tpl+=' var(--yw)';

    var h='<div class="ygrid" id="mgrid" style="grid-template-columns:'+tpl+'">';
    // ① 上の数（くり下がりの 書きこみ場所つき）
    h+='<div class="ysign"></div>';
    p.es.forEach(function(e,k){
      if(k===p.ints) h+= (hisA.d>0) ? '<div class="ydot">.</div>' : '<div class="ydot"></div>';
      var top='', sub='';
      if(missBorrow && missStage>=1 && k===missBorrow.l) top=String(missBorrow.newLeft);
      if(missBorrow && missStage>=2 && k===missBorrow.c) sub='1';
      h+='<div class="ydig dwrap" data-c="'+k+'">'+
         '<span class="dsub">'+sub+'</span><span class="dtop">'+top+'</span>'+hDigAt(p.aS,e)+'</div>';
    });
    // ② 下の数（＋／− は すぐ 左の マスに）
    h+='<div class="ysign">'+((lead===0) ? sg : '')+'</div>';
    p.es.forEach(function(e,k){
      if(k===p.ints) h+= (hisB.d>0) ? '<div class="ydot">.</div>' : '<div class="ydot"></div>';
      if(k===lead-1){ h+='<div class="ydig sgc">'+sg+'</div>'; return; }
      h+='<div class="ydig">'+hDigAt(p.bS,e)+'</div>';
    });
    // ③ 横線
    h+='<div class="yline"></div>';
    // ④ こたえ（クリックできる マス）＋ くり上がりの 1
    h+='<div class="ysign"></div>';
    p.es.forEach(function(e,k){
      if(k===p.ints) h+='<div class="ydot adot">.</div>';
      var v=missShown[k]||'';
      var cc=(car[k+1] && (k+1)>lead) ? '1' : '';       // 右の列から 上がってきた 1
      var cls='mans';
      if(v==='') cls+=' empty';
      if(missFixed[k]) cls+=' fix';
      if(hisHint && missBad[k]) cls+=' hint';
      h+='<div class="hwrap">'+
         '<div class="'+cls+'" data-c="'+k+'">'+v+'</div>'+
         '<div class="ccell">'+cc+'</div>'+
         '<span class="zx'+(missStruck[k] ? ' on' : '')+'"></span>'+
         '</div>';
    });
    h+='<svg class="dlines" id="mlines" preserveAspectRatio="none"></svg>';
    h+='</div>';
    return h;
  }
  function missCell(c){ return document.querySelector('#mgrid .mans[data-c="'+c+'"]'); }
  function missTopAt(c){ var d=document.querySelector('#mgrid .dwrap[data-c="'+c+'"]'); return d ? d.querySelector('.dtop') : null; }
  function missSubAt(c){ var d=document.querySelector('#mgrid .dwrap[data-c="'+c+'"]'); return d ? d.querySelector('.dsub') : null; }
  // くり下がりの 斜線（左の数を 消す 1本）
  function missDrawLine(){
    var svg=document.getElementById('mlines'), g=document.getElementById('mgrid'), gr, e1, r, ln;
    if(!svg||!g) return;
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    if(!(missBorrow && missStage>=1)) return;
    gr=g.getBoundingClientRect(); if(gr.width<=0) return;
    svg.setAttribute('viewBox','0 0 '+gr.width+' '+gr.height);
    e1=g.querySelector('.dwrap[data-c="'+missBorrow.l+'"]'); if(!e1) return;
    r=e1.getBoundingClientRect();
    ln=document.createElementNS('http://www.w3.org/2000/svg','line');
    ln.setAttribute('x1', r.left-gr.left+1);  ln.setAttribute('y1', r.top-gr.top+2);
    ln.setAttribute('x2', r.right-gr.left-1); ln.setAttribute('y2', r.bottom-gr.top-2);
    svg.appendChild(ln);
  }
  function missSetCell(c, v){
    missShown[c]=v; missFixed[c]=true; missBad[c]=false;
    var el=missCell(c);
    if(el){ el.textContent=v; el.classList.remove('empty','hint','ng'); el.classList.add('fix'); }
  }
  function missBind(){
    Array.prototype.forEach.call(document.querySelectorAll('#mgrid .mans'), function(el){
      el.addEventListener('click', function(){ missClick(+el.getAttribute('data-c')); });
    });
  }
  // くり下がりを 紙と 同じ 手じゅんで 見せる
  //   ① 左の数に 斜線・上に 1へった数 → ② その くらいの 左に 小さい1 → ③ 計算 → ④ 左の くらいも 計算
  function missBorrowRun(){
    var b=missBorrow, D=800, t;
    missBusy=true;
    setFb('くり下がりだね。左の くらいから 1 かりるよ','neutral');
    setTimeout(function(){
      missStage=1;
      t=missTopAt(b.l); if(t){ t.textContent=String(b.newLeft); t.classList.add('fix'); }
      missDrawLine();
    }, 150);
    setTimeout(function(){
      missStage=2;
      t=missSubAt(b.c); if(t){ t.textContent='1'; t.classList.add('fix'); }
      setFb('かりてきた 1 を 右の くらいの 左に 書くよ','neutral');
    }, 150+D);
    setTimeout(function(){
      missStage=3; missSetCell(b.c, b.rightWant);
    }, 150+D*2);
    setTimeout(function(){
      missStage=4; missSetCell(b.l, b.leftWant);
      missBusy=false; missAfterFix();
    }, 150+D*3);
  }
  function missClick(c){
    if(missBusy || missDone) return;
    hideMaru(); hideBatsu();
    if(!missBad[c]){                                   // 合っている ところを 押した
      var el=missCell(c);
      if(el){ el.classList.add('ng'); setTimeout(function(){ el.classList.remove('ng'); }, 800); }
      setFb('ここは 合って いるよ。ほかを さがそう','ng'); showBatsu();
      return;
    }
    if(missKind==='subcalc'){ missBorrowRun(); return; }
    if(missKind==='add0'){                             // うしろの0に 斜線を 引く
      missStruck[c]=true; missBad[c]=false; missFixed[c]=true;
      var w=missCell(c), z=w ? w.parentNode.querySelector('.zx') : null;
      if(w) w.classList.remove('hint');
      if(z) z.classList.add('on');
      missAfterFix(); return;
    }
    missSetCell(c, hDigAt(hAnsStr(), hPlaces().es[c]));  // 正しい 数字に なおす
    missAfterFix();
  }
  function missAfterFix(){
    var k, left=false;
    for(k in missBad){ if(missBad[k]) left=true; }
    if(left){ setFb('いいね。まだ あるよ','neutral'); return; }
    missDone=true; hisSolved=true;
    okAnswer((missKind==='add0') ? hAnsStr() : hCanon());
  }
  function checkMiss(){
    if(missDone) return;
    setFb('まちがって いる ところを クリックしてね','neutral');
  }

  function renderHis(){
    var isWord=(hisFmt==='word'), isBase=(hisFmt==='base'), isYoko=(hisFmt==='yoko'), isPick=(hisFmt==='pick'),
        isMiss=(hisFmt==='miss');
    // 筆算の マス（#hisgrid）は「計算する」と「まちがいさがし」のとき。
    var showGrid = (hisFmt==='tate');
    var sg = (hisOp==='add') ? '＋' : '－';

    // 文しょうだい（「。」で 行を分けて 2行に する）
    var wd=document.getElementById('hisword');
    wd.style.display = isWord ? '' : 'none';
    wd.innerHTML = isWord ? storyHtml(hisStory) : '';
    // 文しょうだいのヒント（式のきめ方。答えは 出さない）
    var tip=document.getElementById('histip');
    tip.style.display = (isWord && hisHint) ? '' : 'none';   // 「選ぶ」のヒントは 赤線なので 文は 出さない
    tip.style.visibility = 'visible';
    tip.textContent = isPick
      ? '小数点（.）が たてに そろって いる ほうが 正しいよ。右はしを そろえるのでは ありません。'
      : '「あわせて」「ぜんぶで」「全体の」→ たし算　／　「のこりは」「つかいました」→ ひき算';
    // 横式（もとの式）
    var ex=document.getElementById('hisexpr');
    ex.style.display = (isYoko || isPick) ? '' : 'none';
    ex.textContent = hNum(hisA) + ' ' + sg + ' ' + hNum(hisB);
    // 横式 → 筆算の マス
    var yw=document.getElementById('yokowrap');
    yw.style.display = isYoko ? '' : 'none';
    if(isYoko){ yw.innerHTML = buildYokoGrid(); yBind(); }
    else { yw.innerHTML = ''; }
    // 横式→筆算（選ぶ）：正しい形と まちがいの形を ならべる
    var pw=document.getElementById('pickwrap');
    pw.style.display = isPick ? '' : 'none';
    pw.classList.toggle('hint', isPick && hisHint);
    if(isPick){
      pw.innerHTML = buildPickHtml(); pickBind();
      if(window.requestAnimationFrame) requestAnimationFrame(pickDrawLines); else pickDrawLines();
    }
    else { pw.innerHTML = ''; }
    // 0.01をもとにして
    var bs=document.getElementById('hisbase');
    bs.style.display = isBase ? '' : 'none';
    if(isBase){
      bs.innerHTML = hisBaseHtml();
      var blanks = bs.querySelectorAll('.vbl');
      Array.prototype.forEach.call(blanks, function(b){
        b.addEventListener('focus', function(){
          var i = +b.getAttribute('data-i');
          if(i!==hbCur) hbSetCur(i, false); else keyTarget = b;   // 自分で さわった □ が いまの □ になる
        });
        b.addEventListener('input', function(){ hideMaru(); hideBatsu(); sanitize(b); hbAdvance(b); });
      });
      keyTarget = blanks[0] || ans;
      hbSetCur(0, false);
      if(window.requestAnimationFrame) requestAnimationFrame(renderBaseHint); else renderBaseHint();
    }

    document.getElementById('hishead').innerHTML =
      isWord ? '式を 書きましょう。'
      : isBase ? hisBaseHead()
      : isYoko ? '筆算の 形に 書きなおしましょう。（計算は しません）'
      : isPick ? '正しい 筆算は どちらでしょう。えらんで クリックしましょう。'
      : isMiss ? 'この 筆算には まちがいが あります。まちがって いる ところを クリックしましょう。'
      : '筆算で 計算しましょう。';

    var g=document.getElementById('hisgrid');
    g.style.display = (showGrid || isMiss) ? '' : 'none';
    if(showGrid){
      g.innerHTML = buildTateGrid(); hBind();
      if(window.requestAnimationFrame) requestAnimationFrame(renderSubHint); else renderSubHint();
    } else if(isMiss){
      g.innerHTML = buildMissGrid(); missBind();
      if(window.requestAnimationFrame) requestAnimationFrame(missDrawLine); else missDrawLine();
    }

    Array.prototype.forEach.call(document.querySelectorAll('#hisops button'), function(b){
      var k=b.getAttribute('data-ho');
      b.classList.toggle('on', hisRand ? (k==='rand') : (k===hisOp));
    });
    var hb=document.getElementById('hHintBtn');
    hb.style.display = '';
    hb.classList.toggle('on', isBase ? baseHintOn : hisHint);
    setBtnLabel(hb,
      isBase ? (baseHintOn ? 'ヒントを消す' : 'ヒント（いまの□）')
      : (hisFmt==='tate') ? 'ヒント（0をおぎなう）'
      : isYoko ? 'ヒント（0をおぎなう）'
      : isPick ? 'ヒント（小数点）'
      : isMiss ? 'ヒント（どこかな）'
      : 'ヒント（式のきめ方）',
      'ヒント（0をおぎなう）');

    // ＋／－ のキーは「文しょうだい」（式を書く）のときだけ
    document.getElementById('padops').style.display = isWord ? '' : 'none';
    // 「つぎの くらい ←」は「筆算」のときだけ
    document.getElementById('padnext').style.display = (hisFmt==='tate') ? '' : 'none';

    // こたえ欄（0.01をもとに・横式 は 画面の □ に入れる）
    var noAns = isBase || isYoko || isPick || isMiss || (hisFmt==='tate');
    var unitEl=document.getElementById('unit');
    unitEl.style.display='none';                 // 式を書くので 単位は つけない
    document.getElementById('ans').style.display = noAns ? 'none' : '';
    document.querySelector('.answer .lbl').textContent =
      isBase ? 'あてはまる数を □ に入れてね'
      : isPick ? '正しい ほうを クリックしてね'
      : isMiss ? 'まちがいを 見つけて クリックしてね'
      : isYoko ? '筆算の マスに 数を 入れてね'
      : (hisFmt==='tate') ? 'こたえを 右の マスから 入れてね'
      : isWord ? '式を 書いてね'
      : 'こたえ';
    ans.placeholder = isWord ? 'れい：5.36+4.5' : 'れい：6.17';
    if(!noAns) keyTarget = ans;

    var rv=document.getElementById('hisreveal');
    if(isBase){
      rv.textContent = hisRevealed ? ('こたえ：'+hisExpected.join('、')) : '';
    } else if(isWord && (hisRevealed || hisSolved)){
      rv.textContent = '式：'+hNum(hisA)+sg+hNum(hisB);
    } else if(isYoko || isPick || isMiss){
      rv.textContent = '';
    } else {
      rv.textContent = hisRevealed ? ('こたえ：'+hCanon()) : '';
    }
  }

  function checkHis(){
    if(hisFmt==='base'){ checkHisBase(); return; }
    if(hisFmt==='yoko'){ checkHisYoko(); return; }
    if(hisFmt==='pick'){ if(!hisSolved) setFb('正しい ほうを クリックしてね','neutral'); return; }
    if(hisFmt==='miss'){ checkMiss(); return; }
    if(hisFmt==='word'){ checkHisWord(); return; }
    checkHisTate();
  }
  // 横式：マスの中身が「位ごとに」合っているか。
  // 右はしにそろえて書くと まちがいになる（そこが ねらい）。
  // その数より下の位は、空けても 0 を書いても ○（3.91 − 0.10 も 正解）。
  function checkHisYoko(){
    var cells=yCells();
    if(cells.length===0) return;
    var any=false;
    Array.prototype.forEach.call(cells, function(c){ if(c.value.trim()!=='') any=true; });
    if(!any){
      Array.prototype.forEach.call(cells, function(c){ c.classList.remove('ng'); });
      setFb('マスに 数を 入れてね','neutral'); return;
    }
    var ok=true;
    [0,1].forEach(function(r){
      var row=Array.prototype.filter.call(cells, function(c){ return +c.getAttribute('data-r')===r; });
      var stopped=false;                       // 0 を書くのを やめたあとは ぜんぶ 空
      row.forEach(function(c){
        var want=c.getAttribute('data-want')||'',
            opt =(c.getAttribute('data-opt')==='1'),
            got =c.value.trim(), good;
        if(!opt){ good=(got===want); }
        else if(stopped){ good=(got===''); }
        else if(got===''){ stopped=true; good=true; }

  function checkHisWord(){
    var raw = ans.value.trim()
      .replace(/[＋]/g,'+').replace(/[－−ー―]/g,'-').replace(/[．。]/g,'.')
      .replace(/\s/g,'').replace(/=.*$/,'').replace(/＝.*$/,'');
    var m = raw.match(/^(\d*\.?\d+)([+\-])(\d*\.?\d+)$/);
    if(!m){ setFb('式を 書いてね（れい：5.36+4.5）','neutral'); return; }
    var x=parseFloat(m[1]), op=m[2], y=parseFloat(m[3]);
    var A=hisA.v/1000, B=hisB.v/1000, eq=function(p,q){ return Math.abs(p-q)<1e-9; };
    var opOk = (op === (hisOp==='add' ? '+' : '-'));
    var numOk = (eq(x,A)&&eq(y,B)) || (hisOp==='add' && eq(x,B)&&eq(y,A));
    if(opOk && numOk){ hisSolved=true; setFb('◯ せいかい！','ok'); showMaru(); renderHis(); }
    else if(!opOk && numOk){ setFb('✗ ＋ と － を もういちど 考えてね','ng'); showBatsu(); }
    else { setFb('✗ もういちど','ng'); showBatsu(); }
  }

  function press(k){
    hideMaru(); hideBatsu();
    var t = keyTarget || ans;
    // 「1・0.1・0.01・0.001」のマスは 1マス1けた。入れたら つぎのマスへ。

        } else { t.value=''; }

      t.value = k; v5AfterType(t); return;                 // 数字は入れかえ
    }
    // 横式 → 筆算の マス（1マス1けた・入れたら つぎのマスへ）
    if(yokoOn() && t.classList && t.classList.contains('ycell')){
      if(k==='.' || k==='+' || k==='-') return;
      if(k==='clear'){ yClearCells(); setFb('',''); return; }
      if(k==='back'){
        if(t.value===''){ var pv=yStep(t,-1); if(pv){ pv.value=''; pv.classList.remove('ng'); ySetCur(pv, document.activeElement===t); } }
        else { t.value=''; t.classList.remove('ng'); }
        return;
      }
      t.value = k; t.classList.remove('ng'); yNext(t); return;
    }
    // 筆算（こたえの マス・メモ欄）。
    //   数字1つ目＝そのマス／2つ目＝十のくらいを 左のメモへ うつして 左へ すすむ。
    //   「つぎの くらい ←」で 左へ。「←」は 消す（からっぽなら 右へ もどる）。
    if(tateOn() && t.classList && (t.classList.contains('hcell') || t.classList.contains('mcell'))){
      var memo = t.classList.contains('mcell');
      if(k==='.' || k==='+' || k==='-') return;
      if(k==='clear'){ hClearCells(); setFb('',''); return; }
      if(k==='next'){ if(!memo) hLeft(t); return; }       // つぎの くらい（左）へ
      if(k==='back'){
        if(memo){ if(t.value!=='') t.value=''; return; }
        if(t.value!==''){ t.value=''; t.classList.remove('ng'); return; }   // まず マスの数
        var mc=hCarOf(t);
        if(mc && mc.value!==''){ mc.value=''; return; }                     // つぎに くり上がりの1
        var rt=hStep(t,1);                                                  // からっぽなら 右へ もどる
        if(rt){
          rt.value=''; rt.classList.remove('ng');
          var rc=hCarOf(rt); if(rc) rc.value='';
          hSetCur(rt, document.activeElement===t);
        }
        return;
      }
      if(memo){ t.value = (t.value+k).slice(-2); return; }  // メモは 2けたまで 書ける
      hPut(t, k); return;
    }
    // 「0.01をもとに」の □（入れおわったら つぎの □ へ。ヒントも そこで 変わる）
    if(hbOn() && t.classList && t.classList.contains('vbl')){
      var hi = +t.getAttribute('data-i');
      if(k==='clear'){ t.value=''; setFb('',''); renderBaseHint(); return; }
      if(k==='back'){
        if(t.value===''){                                  // からっぽなら 前の □ へ もどる
          if(hi>0){ var hp=hbBlankAt(hi-1); if(hp){ hp.value=hp.value.slice(0,-1); hbSetCur(hi-1, document.activeElement===t); } }
        } else { t.value = t.value.slice(0,-1); renderBaseHint(); }
        return;
      }
      if(k==='+' || k==='-') return;
      if(k==='.'){                                         // 小数点は さいごの □ だけ
        if(hi<2) return;
        if(t.value===''){ t.value='0.'; } else if(t.value.indexOf('.')<0){ t.value += '.'; }
        renderBaseHint(); return;
      }
      t.value += k; sanitize(t); hbAdvance(t); return;
    }
    if(k==='clear'){ t.value=''; setFb('',''); }
    else if(k==='back'){ t.value = t.value.slice(0,-1); }
    else if(k==='+' || k==='-'){                           // 式を書くとき（文しょうだい）だけ
      if(!ansOpsMode() || t!==ans) return;
      var last = t.value.slice(-1);
      if(t.value==='' || last==='+' || last==='-' || last==='.') return;
      if(/[+\-]/.test(t.value)) return;                    // 演算のきごうは 1つだけ
      t.value += k;
    }
    else if(k==='.'){ if(!/\.\d*$/.test(t.value) && t.value!=='' && !/[+\-]$/.test(t.value)){ t.value += '.'; }
                      else if(t.value===''){ t.value='0.'; }
                      else if(/[+\-]$/.test(t.value)){ t.value += '0.'; } }
    else { t.value += k; v7AutoDot(); }
    v7After();                                           // 「数を書く」は 上の表と下線も なおす
    kgAfter();                                           // 「kg単位」は マスに 打った数字を うつす
    hbAfter();                                           // 「0.01をもとに」は ヒントを いまの□に 合わせる
  }

    var keep = null, keepSel = '';
    if(yokoOn()){ keepSel = '#ygrid .ycell'; }
    else if(tateOn()){ keepSel = '#hgrid .vbl'; }
    if(keepSel){ keep=[]; Array.prototype.forEach.call(document.querySelectorAll(keepSel), function(c){ keep.push(c.value); }); }
    hisHint = !hisHint; renderHis();
    if(keep){
      var cs=document.querySelectorAll(keepSel);
      if(cs.length===keep.length) Array.prototype.forEach.call(cs, function(c,i){ c.value=keep[i]; });
    }
    if(tateOn()){                                   // 青わくを いまの くらいに もどす
      var hs=hCells(), tgt=null, q;
      for(q=hs.length-1;q>=0;q--){ if(hs[q].value===''){ tgt=hs[q]; break; } }
      hSetCur(tgt || hs[0], false);
    }
    this.blur();
  });
  window.addEventListener('resize', function(){
    if(mode==='his' && hisFmt==='base') renderBaseHint();
    if(pickOn()) pickDrawLines();
    if(tateOn()) renderSubHint();
    if(missOn()) missDrawLine();
  });
  document.getElementById('hNextBtn').addEventListener('click', function(){
    newHis(); clearAll(); renderHis(); this.blur();
  });

  // --- 10倍モードの操作 ---
  function pickMulOp(){ return ['x10','x100','d10','d100'][rnd(0,3)]; }
  function updateOpChips(){
    Array.prototype.forEach.call(document.querySelectorAll('#ops button'), function(b){
      var op=b.getAttribute('data-op');
      b.classList.toggle('on', mulRand ? (op==='rand') : (op===mulOp));
    });
  }
  Array.prototype.forEach.call(document.querySelectorAll('#ops button'), function(b){
    b.addEventListener('click', function(){
      var op = b.getAttribute('data-op');
      if(op==='rand'){ mulRand=true; op=pickMulOp(); }
      else { mulRand=false; }
      mulOp = op;
      newMul(op);                        // 押すたびに新しい数。割り算なら整数スタート多め
      updateOpChips(); clearAll(); renderMul();
    });
  });

  // 小数点をドラッグ（数字は固定／点だけ動く・列は固定なので位置を正確に判定）
  var mover = document.getElementById('mover');
  var dragging = false;
  function posFromEvent(e){
    var svg = mover.querySelector('svg'); if(!svg) return null;
    // 画面の大きさで拡大縮小されても正しく位置を読む（SVGの座標に変換）
    var ctm = svg.getScreenCTM(); if(!ctm) return null;
    var pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    var x = pt.matrixTransform(ctm.inverse()).x;
    var p = Math.round((x - MV_M - mvOffset)/MV_W) - 2;
    if(mulIsInteger && !mulPlaced){
      return Math.max(1, Math.min(digits.length, p));   // 点をつける段階：数字のあいだ〜右はし
    }
    return Math.max(BASEPOS-2, Math.min(BASEPOS+2, p));
  }
  function applyPos(p){
    if(p===null) return;
    if(mulIsInteger && !mulPlaced){
      if(p!==pointPos || !mulPointShown){ pointPos=p; mulPointShown=true; }
      if(pointPos===digits.length){                     // 右はしを選んだら確定
        mulPlaced=true; mulPointShown=false; mulMsg=''; dragging=false; renderMul();
      } else {
        mulMsg='ちがうよ。整数の 小数点は いちばん 右はし（一のくらいの 右）だよ。';
        renderMul();
      }
      return;
    }
    if(p!==pointPos){ pointPos=p; hideMaru(); hideBatsu(); renderMul(); }
  }
  mover.addEventListener('pointerdown', function(e){
    dragging = true;
    applyPos(posFromEvent(e));
    if(mover.setPointerCapture){ try{ mover.setPointerCapture(e.pointerId); }catch(_){} }
    e.preventDefault();
  });
  mover.addEventListener('pointermove', function(e){
    if(!dragging) return;
    applyPos(posFromEvent(e));
  });
  mover.addEventListener('pointerup', function(){ dragging=false; });
  mover.addEventListener('pointercancel', function(){ dragging=false; });

  document.getElementById('ptReset').addEventListener('click', function(){
    if(mulIsInteger){ mulPlaced=false; mulPointShown=false; mulMsg=''; pointPos=digits.length; }
    else { pointPos = BASEPOS; }
    hideMaru(); hideBatsu(); renderMul();
  });

  // --- タブ切りかえ ---
  // 大タブ（上）と 小タブ（ボードの上）の2だん。
  // 小タブのid は、'v1'〜'v9'＝「小数の見方」の画面の見方、
  // 'tate'/'yoko'＝筆算タブの形、'word'/'base'＝考えるタブ（どちらも mode='his'）、
  // それ以外＝そのままモード名。
  var TAB_ITEMS = {
    rep : ['v8','kg','v7'],                // 小数の表し方
    sys : ['v5','v6','v9','ineq','mul'],   // 小数のしくみ
    nl2 : ['nl1','nl2'],                   // 数直線（かんたん＝1目もり0.001 / 難しい＝はば0.1）
    his : ['tate','pick','yoko','miss'],   // 筆算（形を 小タブで えらぶ）
    view: ['v1','v2','v3'],                // 小数の見方
    think:['word','base']                  // 考える（文しょうだい・0.01をもとに）
  };
  var HIS_FMTS = ['tate','pick','yoko','word','base','miss'];
  var tabNow='rep', subNow='v8';
  var tab2 = document.getElementById('tab2'),
      tab4 = document.getElementById('tab4'),
      tabRep = document.getElementById('tabRep'),
      tabSys = document.getElementById('tabSys'),
      tabHis = document.getElementById('tabHis'),
      tabThink = document.getElementById('tabThink');

  function isVpSub(id){ return /^v[1-9]$/.test(id); }
  function isHisSub(id){ return HIS_FMTS.indexOf(id) >= 0; }
  function pickSub(){ var L=TAB_ITEMS[tabNow]||[]; return L[rnd(0,L.length-1)]; }
  function updateSubChips(){
    Array.prototype.forEach.call(document.querySelectorAll('#subtabs button'), function(b){
      var id=b.getAttribute('data-sub');
      b.classList.toggle('on', subRand ? (id==='rand') : (id===subNow));
    });
  }
  // 小タブを えらぶ（モードごと切りかわることもある）
  function goSub(id){
    subNow = id;
    updateSubChips();
    if(isVpSub(id)){ viewVp = id; setMode('view'); }
    else if(isHisSub(id)){ hisFmt = id; setMode('his'); }
    else setMode(id);
  }
  function setTab(t){
    tabNow = t;
    tabRep.classList.toggle('on', t==='rep');
    tabSys.classList.toggle('on', t==='sys');
    tab2.classList.toggle('on', t==='nl2');
    tabHis.classList.toggle('on', t==='his');
    tab4.classList.toggle('on', t==='view');
    tabThink.classList.toggle('on', t==='think');
    var items = TAB_ITEMS[t];
    document.getElementById('subtabs').style.display = items ? '' : 'none';
    document.getElementById('rops').style.display = (t==='rep')  ? '' : 'none';
    document.getElementById('nops').style.display = (t==='nl2')  ? '' : 'none';
    document.getElementById('sops').style.display = (t==='sys')  ? '' : 'none';
    document.getElementById('hops').style.display = (t==='his')  ? '' : 'none';
    document.getElementById('vops').style.display = (t==='view') ? '' : 'none';
    document.getElementById('tops').style.display = (t==='think')? '' : 'none';
    subRand = false;
    if(window.Challenge10 && Challenge10.isOn()) Challenge10.reset();   // 大タブを変えたときだけ リセット
    if(items) goSub(items[0]);
    else { subNow=''; setMode(t); }        // 小タブの ない タブ
  }

  function setMode(m){
    mode = m;
    var isNL=(m==='nl1'||m==='nl2'), isMul=(m==='mul'), isView=(m==='view'), isIneq=(m==='ineq'), isKg=(m==='kg'), isHis=(m==='his');
    document.getElementById('nlArea').style.display   = isNL ? '' : 'none';
    document.getElementById('kgArea').style.display   = isKg ? '' : 'none';
    document.getElementById('hisArea').style.display  = isHis ? '' : 'none';
    document.getElementById('rowHis').style.display   = isHis ? '' : 'none';
    document.getElementById('mulArea').style.display  = isMul ? '' : 'none';
    document.getElementById('viewArea').style.display = isView ? '' : 'none';
    document.getElementById('ineqArea').style.display = isIneq ? '' : 'none';
    document.getElementById('rowNL').style.display    = isNL ? '' : 'none';
    document.getElementById('rowKg').style.display    = isKg ? '' : 'none';
    document.getElementById('rowMul').style.display   = isMul ? '' : 'none';
    document.getElementById('rowView').style.display  = isView ? '' : 'none';
    document.getElementById('rowIneq').style.display  = isIneq ? '' : 'none';
    syncAnswerPanel();
    document.getElementById('sub').style.display      = isNL ? '' : 'none';
    var unitEl = document.getElementById('unit');
    if(isNL){ unitEl.textContent='m'; unitEl.style.display=''; }
    else if(isKg){ unitEl.textContent='kg'; unitEl.style.display=''; }
    else { unitEl.style.display='none'; }
    document.getElementById('ans').style.display      = isView ? 'none' : '';
    document.getElementById('padops').style.display   = 'none';   // ＋／－は 文しょうだいのときだけ（renderHisで出す）
    document.getElementById('padnext').style.display  = 'none';   // 「つぎの くらい」も 筆算のときだけ
    document.querySelector('.answer .lbl').textContent = isView ? 'あてはまる数を □ に入れてね' : 'こたえ';
    // 小タブ（モード）が変わったら ヒントは いったん消す
    hintStage=0; mulHint=false; kgHint=false; ineqHint=false; ineqHidden=false; hisHint=false;
    clearAll();
    keyTarget = ans;
    if(isMul){
      ans.placeholder = 'れい：91.3';
      mulRand = subRand; mulOp = subRand ? pickMulOp() : 'x10';
      newMul(mulOp); updateOpChips(); renderMul();
    } else if(isView){
      vHintBtn.classList.remove('on');
      newView(); renderView();
    } else if(isIneq){
      newIneq(); renderIneq();
    } else if(isKg){
      ans.placeholder = 'れい：3.45';
      kgRand = subRand; newKg(); renderKg();
    } else if(isHis){
      ans.placeholder = 'れい：6.17';
      hisHint=false;          // hisFmt は 小タブ（goSub）で きまる。たし算/ひき算は そのまま のこす
      newHis(); renderHis();
    } else {
      level = (m==='nl1') ? 1 : 2;
      nlFirstTall = (m==='nl2');            // 「難しい」は 1問目を 0.01 ちょうどに
      ans.placeholder = (level===1) ? 'れい：4.297' : 'れい：2.413';
      regenerate(); render();
    }
  }
  tabRep.addEventListener('click', function(){ if(tabNow!=='rep') setTab('rep'); });
  tabSys.addEventListener('click', function(){ if(tabNow!=='sys') setTab('sys'); });
  tab2.addEventListener('click',   function(){ if(tabNow!=='nl2') setTab('nl2'); });
  tabHis.addEventListener('click', function(){ if(tabNow!=='his') setTab('his'); });
  tab4.addEventListener('click',   function(){ if(tabNow!=='view') setTab('view'); });
  tabThink.addEventListener('click', function(){ if(tabNow!=='think') setTab('think'); });
  // 小タブ
  Array.prototype.forEach.call(document.querySelectorAll('#subtabs button'), function(b){
    b.addEventListener('click', function(){
      var id = b.getAttribute('data-sub');
      if(id==='rand'){ subRand=true; goSub(pickSub()); }
      else { subRand=false; goSub(id); }
      this.blur();
    });
  });

  // --- 10問チャレンジ：いまのタブで「つぎの問題」を出す ---
  function nextProblem(){
    if(subRand){                       // ランダム小タブ：まいかい 種類を えらびなおす
      goSub(pickSub());
      if(window.Challenge10) Challenge10.newProblem();
      return;
    }
    if(mode==='mul'){
      if(mulRand) mulOp = pickMulOp();
      newMul(mulOp); updateOpChips(); clearAll(); renderMul();
    } else if(vOn()){
      newViewArrow(); clearAll(); renderView();
    } else if(mode==='ineq'){
      newIneq(); hideMaru(); hideBatsu(); renderIneq();
    } else if(mode==='kg'){
      newKg(); clearAll(); renderKg();
    } else if(mode==='his'){
      newHis(); clearAll(); renderHis();
    } else {
      newArrow(); clearAll(); render();
    }
    if(window.Challenge10) Challenge10.newProblem();
  }

  /* ===== 📝 テストの練習 との つなぎ（ブリッジ）=====================
     本体は (function(){ … })() の 中なので、外から さわれない。
     「テストの練習」（ページの いちばん下の ①②）が つかう ぶんだけ、
     ここで window.ShousuuApp として 外に 出しておく。
     ここを 消すと テストの練習だけ 動かなくなる（本体は そのまま 動く）。 */
  var TAB_LABEL = { rep:'小数の表し方', sys:'小数のしくみ', nl2:'数直線',
                    his:'筆算', view:'小数の見方', think:'考える' };
  function tabOfSub(id){
    var t; for(t in TAB_ITEMS){ if(TAB_ITEMS[t].indexOf(id) >= 0) return t; }
    return null;
  }
  function subLabelOf(id){
    var b = document.querySelector('#subtabs button[data-sub="'+id+'"]');
    return b ? b.textContent : id;
  }
  // 大問の せってい（op／unit）を 入れて、その場で 問題を 作りなおす
  function testApplyOpt(id, opt){
    if(!opt) return;
    if(isHisSub(id) && opt.op){                       // 筆算・考える：たし算／ひき算
      hisRand = (opt.op === 'rand');
      if(!hisRand) hisOp = opt.op;
      newHis(); clearAll(); renderHis();
    } else if(id === 'kg' && opt.unit){                // kg単位：重さ／長さ
      kgRand = (opt.unit === 'rand');
      if(!kgRand) kgUnit = opt.unit;
      newKg(); clearAll(); renderKg();
    } else if(id === 'mul' && opt.op){                 // 10倍：×10／×100／1/10／1/100
      mulRand = (opt.op === 'rand');
      mulOp = mulRand ? pickMulOp() : opt.op;
      newMul(mulOp); updateOpChips(); clearAll(); renderMul();
    }
  }
  window.ShousuuApp = {
    version: 'shousuu-bridge-1',
    has:   function(id){ return !!tabOfSub(id); },
    label: function(id){
      var t = tabOfSub(id);
      return t ? (TAB_LABEL[t] + '／' + subLabelOf(id)) : id;
    },
    // 小タブを ひらく。opt = { op:'add'|'sub'|'rand'（筆算）／'x10'…（10倍）, unit:'kg'|'km'|'rand' }
    open: function(id, opt){
      var t = tabOfSub(id); if(!t) return false;
      cancelAutoNext();
      if(tabNow !== t) setTab(t);
      subRand = false;
      goSub(id);
      testApplyOpt(id, opt);
      return true;
    },
    // テストを 始める前の ようすを おぼえる／もどす
    snapshot: function(){
      return { tab:tabNow, sub:subNow, rand:subRand,
               hisOp:hisOp, hisRand:hisRand, kgUnit:kgUnit, kgRand:kgRand,
               mulOp:mulOp, mulRand:mulRand };
    },
    restore: function(s){
      if(!s) return;
      cancelAutoNext();
      hisOp=s.hisOp; hisRand=s.hisRand; kgUnit=s.kgUnit; kgRand=s.kgRand;
      mulOp=s.mulOp; mulRand=s.mulRand;
      if(tabNow !== s.tab) setTab(s.tab);
      subRand = s.rand;
      var back = s.rand ? pickSub() : (s.sub || (TAB_ITEMS[s.tab]||[])[0]);
      if(back){
        goSub(back);
        testApplyOpt(back, { op: isHisSub(back) ? (s.hisRand?'rand':s.hisOp)
                               : (back==='mul' ? (s.mulRand?'rand':s.mulOp) : null),
                             unit: (back==='kg') ? (s.kgRand?'rand':s.kgUnit) : null });
      }
      subRand = s.rand;
      updateSubChips();
    },
    cancelAutoNext: cancelAutoNext,
    waitMs: function(){ return AUTO_NEXT_MS; }
  };

  setTab('rep');
  if(window.Challenge10){
    Challenge10.init({
      mount: '#chal-mount',
      total: 10,
      next: nextProblem,
      record: false,          // true にすると「きょうの最高記録」が のこる
      recordKey: 'shousuu4'
    });
  }
})();
</script>

<!-- ============================================================
     📝 テストの 練習 ①せってい（ここだけ 直せばよい）
     mode … 小タブの id
       小数の表し方 : v8（水のかさ）/ kg（kg単位）/ v7（合わせた数）
       小数のしくみ : v5（位取り）/ v6（何の位？）/ v9（集めた数）/ ineq（不等号）/ mul（10倍）

       筆算         : tate（計算する）/ pick（選ぶ）/ yoko（書く）/ miss（まちがいさがし）
       小数の見方   : v1（あわせた数）/ v2（○より小さい）/ v3（0.01が□こ）
       考える       : word（文しょうだい）/ base（0.01をもとに）
     set … 開く前に 入れる もの（テストが おわると もとに もどる）

<!-- ============================================================
     📝 テストの 練習 ②しくみ（小数39・2026-09-26）— さわらない

<script>
window.TestRun = (function(){
  'use strict';
  var S = window.TEST_SETTEI;
  var A = window.ShousuuApp;
  var P = Object.assign({
      after  : '#chal-mount',
      tabs   : '.levels,#subtabs',

    }, (S && S.parts) || {});
  var $ = function(id){ return document.getElementById(id); };
  var q = function(sel){ return sel ? document.querySelector(sel) : null; };

  /* ---- 本体の ブリッジが あるか ---- */
  if(!A || typeof A.open !== 'function'){
    console.warn('テストの練習：本体の ShousuuApp（ブリッジ）が ないので うごきません');
    return null;
  }
  if(!S || !Array.isArray(S.tests) || !S.tests.length){
    console.warn('テストの練習：TEST_SETTEI.tests が ありません');
    return null;
  }

  /* ---- せっていを たしかめる（ない 小タブは とばす）---- */
  var TESTS = S.tests.map(function(t){
    return {
      title: t.title || 'テスト',
      items: (t.items || []).filter(function(it){
        if(it && A.has(it.mode)) return true;
        console.warn('テストの練習：小タブ「' + (it && it.mode) + '」が ないので とばします（' + t.title + '）');
        return false;
      })
    };
  }).filter(function(t){ return t.items.length; });
  if(!TESTS.length){ console.warn('テストの練習：出せる 大問が ありません'); return null; }

  var setOf    = function(it){ return Object.assign({}, it.op !== undefined ? { op: it.op } : {}, it.set || {}); };
  var itemName = function(it){ return it.name || A.label(it.mode); };
  var waitMs   = function(){
    return (typeof S.waitMs === 'number') ? S.waitMs
         : ((typeof A.waitMs === 'function' ? A.waitMs() : 2200) + 600);
  };

  var run = null;      // { t, i, rec:[{miss,hint,st}], back }
  var myTimer = 0;

  /* ---- 見た目（本体の <style> は さわらない）---- */
  var css = document.createElement('style');
  css.id = 'test-style';
  css.textContent = [
    '#test-mount{position:relative;flex:0 0 auto;display:flex;align-items:center;}',
    '#test-btn{font-family:inherit;font-size:1rem;font-weight:bold;padding:7px 16px;white-space:nowrap;',
    '  color:#127a6e;background:#e3f6f2;border:2px solid #7fd3c6;border-radius:20px;box-shadow:0 2px 0 #7fd3c6;cursor:pointer;}',
    '#test-btn:focus-visible,#test-menu button:focus-visible,#test-bar button:focus-visible,#test-result button:focus-visible{outline:3px solid #127a6e;outline-offset:2px;}',
    '#test-menu{display:none;position:absolute;top:calc(100% + 8px);right:0;z-index:950;background:#fff;border:3px solid #cfd8dd;',
    '  border-radius:16px;padding:10px;box-shadow:0 8px 24px rgba(42,55,66,.20);flex-direction:column;gap:8px;min-width:250px;max-width:92vw;}',
    '#test-menu.open{display:flex;}',
    '#test-menu button{font-family:inherit;font-size:1rem;padding:10px 14px;border-radius:12px;border:2px solid #7fd3c6;',
    '  background:#fff;color:#28323c;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:14px;white-space:nowrap;}',
    '#test-menu button:hover{background:#f1fbf9;}',
    '#test-menu small{font-size:.85em;color:#6a7780;}',
    '#test-bar{display:none;align-items:center;gap:10px;background:rgba(255,255,255,.94);border:2px solid #7fd3c6;border-radius:20px;',
    '  padding:4px 6px 4px 14px;font-family:inherit;font-weight:bold;color:#127a6e;white-space:nowrap;}',
    '#test-dots{letter-spacing:2px;}',
    '#test-skip,#test-stop{font-family:inherit;font-size:.85em;padding:4px 12px;border-radius:14px;border:2px solid #cfd8dd;background:#fff;color:#6a7780;cursor:pointer;}',
    '#test-skip{border-color:#7fd3c6;color:#127a6e;}',
    'body.testing #test-btn{display:none;}',
    'body.testing #test-bar{display:flex;}',
    'body.testing #chal-mount{display:none;}',
    'body.testing #hisops,body.testing #kgops,body.testing #mulArea #ops{pointer-events:none;opacity:.55;}',
    P.tabs.split(',').map(function(s){ return 'body.testing ' + s.trim(); }).join(',') + '{pointer-events:none;opacity:.45;}',
    '#test-result{display:none;position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:1000;align-items:center;justify-content:center;}',
    '#test-result.show{display:flex;}',
    '#test-result .tr-card{background:#fff;border-radius:20px;padding:22px 26px;box-shadow:0 10px 40px rgba(0,0,0,.3);',
    '  max-width:94vw;max-height:92vh;overflow:auto;font-family:inherit;color:#28323c;}',
    '#test-result .tr-title{font-size:clamp(1.1rem,3vh,1.5rem);font-weight:800;color:#127a6e;text-align:center;margin-bottom:12px;}',
    '#test-result table{border-collapse:collapse;font-size:clamp(.85rem,2.2vh,1.05rem);margin:0 auto;}',
    '#test-result td{padding:6px 10px;border-bottom:2px dashed #e7ecef;white-space:nowrap;}',
    '#test-result td.no{color:#6a7780;}',
    '#test-result td.r-ok{color:#2f9e60;font-weight:bold;}',
    '#test-result td.r-ng{color:#d8533a;font-weight:bold;}',
    '#test-result td.r-sk{color:#9aa6b5;}',
    '#test-result .tr-sum{text-align:center;margin-top:12px;font-size:clamp(1rem,2.6vh,1.25rem);}',
    '#test-result .tr-sum b{color:#d8533a;font-size:1.3em;}',
    '#test-result .tr-btns{display:flex;gap:12px;justify-content:center;margin-top:16px;}',
    '#test-result button{font-family:inherit;font-size:1rem;padding:10px 20px;border-radius:14px;cursor:pointer;}',
    '#test-again{color:#fff;background:#1fae9c;border:none;box-shadow:0 3px 0 #127a6e;}',
    '#test-close{color:#6a7780;background:#fff;border:2px solid #cfd8dd;}'
  ].join('\n');
  document.head.appendChild(css);

  /* ---- ボタン・メニュー・帯（10問チャレンジの となり）---- */
  var mount = document.createElement('div');
  mount.id = 'test-mount';
  mount.innerHTML =
      '<button id="test-btn" type="button">' + (S.button || '📝 テストの 練習') + '</button>'
    + '<div id="test-menu">'
    +   TESTS.map(function(t,k){ return '<button type="button" data-k="'+k+'">'+t.title+'<small>'+t.items.length+'問</small></button>'; }).join('')
    + '</div>'
    + '<div id="test-bar"><span id="test-no"></span><span id="test-dots"></span>'
    +   '<button id="test-skip" type="button">とばす</button>'
    +   '<button id="test-stop" type="button">やめる</button></div>';
  var anchor = q(P.after);
  var top = document.querySelector('.top');
  if(anchor && anchor.parentNode) anchor.parentNode.insertBefore(mount, anchor.nextSibling);
  else if(top) top.appendChild(mount);
  else document.body.insertBefore(mount, document.body.firstChild);
  var res = document.createElement('div');
  res.id = 'test-result';
  document.body.appendChild(res);

  /* テストが 1つだけなら、メニューを 出さずに すぐ 始める */
  $('test-btn').addEventListener('click', function(e){
    e.stopPropagation();
    if(TESTS.length === 1){ start(0); return; }
    var m = $('test-menu');
    m.classList.toggle('open');
    if(m.classList.contains('open')) placeMenu();
  });
  /* せまい 画面で メニューが 左に はみ出す ときは、画面の 中へ ずらす */
  function placeMenu(){
    var m = $('test-menu');
    m.style.left = ''; m.style.right = '';
    var r = m.getBoundingClientRect(), mr = mount.getBoundingClientRect();
    if(r.left < 8){ m.style.right = 'auto'; m.style.left = (8 - mr.left) + 'px'; }
  }
  $('test-menu').addEventListener('click', function(e){
    var b = e.target.closest('button[data-k]'); if(!b) return;
    $('test-menu').classList.remove('open');
    start(+b.dataset.k);
  });
  document.addEventListener('click', function(e){
    if(!e.target.closest('#test-mount')) $('test-menu').classList.remove('open');
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') $('test-menu').classList.remove('open');
  });
  $('test-skip').addEventListener('click', function(){ skip(); });
  $('test-stop').addEventListener('click', function(){ stop(); });

  /* テストの あいだの「つぎの問題／再生成」は、その 大問を とばして つぎの 大問へ */
  document.addEventListener('click', function(e){
    if(!run || !P.next || !e.target.closest(P.next)) return;
    e.stopPropagation(); e.preventDefault();
    skip();
  }, true);

  /* ヒントを 見たか（ヒントボタンを おしたら 💡）*/
  Array.prototype.forEach.call(document.querySelectorAll(P.hint), function(b){
    b.addEventListener('click', function(){
      var r = cur();
      if(r && r.st === 'todo') r.hint = true;
    });
  });

  /* ---- 中身 ---- */
  function cur(){ return run ? run.rec[run.i] : null; }
  function clearMine(){ if(myTimer){ clearTimeout(myTimer); myTimer = 0; } }
  function bar(){
    if(!run) return;
    var T = TESTS[run.t], it = T.items[run.i];
    $('test-no').textContent = '📝 ' + (/^\d+$/.test(it.no) ? it.no+'問め' : it.no) + '（' + (run.i+1) + '／' + T.items.length + '）';
    $('test-dots').textContent = run.rec.map(function(r,i){
      return r.st==='done' ? '●' : r.st==='skip' ? '－' : (i===run.i ? '◎' : '○');
    }).join('');
  }
  function go(i){
    clearMine();
    run.i = i;
    var it = TESTS[run.t].items[i];
    A.open(it.mode, setOf(it));
    bar();
  }
  function start(t){
    var cb = q(P.chalBtn);
    if(window.Challenge10 && Challenge10.isOn && Challenge10.isOn() && cb) cb.click();
    res.classList.remove('show');
    var back = run ? run.back : A.snapshot();
    run = { t:t, i:0, back:back,
            rec: TESTS[t].items.map(function(){ return { miss:0, hint:false, st:'todo' }; }) };
    document.body.classList.add('testing');
    go(0);
  }
  function next(){
    if(!run) return;
    if(run.i + 1 < run.rec.length) go(run.i + 1);
    else finish();
  }
  function skip(){
    var r = cur(); if(!r) return;
    if(r.st !== 'done') r.st = 'skip';
    clearMine();
    if(typeof A.cancelAutoNext === 'function') A.cancelAutoNext();
    next();
  }
  function finish(){
    clearMine();
    var T = TESTS[run.t], perfect = 0;
    var rows = T.items.map(function(it,i){
      var r = run.rec[i], tx, c;
      if(r.st==='done' && r.miss===0){ tx = '⭕ ノーミス'; c = 'r-ok'; perfect++; }
      else if(r.st==='done'){ tx = 'まちがい '+r.miss+'回'; c = 'r-ng'; }
      else { tx = 'とばした'; c = 'r-sk'; }
      return '<tr><td class="no">'+it.no+'</td><td>'+itemName(it)+'</td><td class="'+c+'">'+tx+'</td><td>'+(r.hint ? '💡' : '')+'</td></tr>';
    }).join('');
    res.innerHTML = '<div class="tr-card">'
      + '<div class="tr-title">📝 '+T.title+'　おわり！</div>'
      + '<table>'+rows+'</table>'
      + '<div class="tr-sum">ノーミスで できた 問題　<b>'+perfect+'</b> ／ '+T.items.length+'</div>'
      + '<div class="tr-btns"><button id="test-again" type="button">もう一度</button><button id="test-close" type="button">とじる</button></div>'
      + '</div>';
    res.classList.add('show');
    $('test-again').onclick = function(){ start(run.t); };
    $('test-close').onclick = function(){ stop(); };
    $('test-again').focus();
  }
  /* やめる／とじる：はじめの タブ・たし算／ひき算などを もどす */
  function stop(){
    if(!run) return;
    var back = run.back;
    run = null;
    clearMine();
    res.classList.remove('show');
    document.body.classList.remove('testing');
    A.restore(back);
  }

  var api = {
    on: function(){ return !!run; },
    /* showMaru から：その 大問は おわり。はなまるの あと つぎの 大問へ */
    onDone: function(){
      if(!run || res.classList.contains('show')) return !!run;
      var r = cur(); r.st = 'done';
      bar();
      clearMine();
      myTimer = setTimeout(function(){ myTimer = 0; next(); }, waitMs());
      return true;
    },
    /* showBatsu から：まちがい */
    miss: function(){ var r = cur(); if(r && r.st === 'todo') r.miss++; },
    /* 外から つかう とき用 */
    start:  function(t){ start(t || 0); },
    stop:   function(){ stop(); },
    record: function(){ return run ? JSON.parse(JSON.stringify(run.rec)) : null; }
  };
  return api;
})();
</script>
<!-- 📝 テストの 練習 ここまで -->
</body>
</html>
